<!DOCTYPE html>
<!-- Title cards for the RockShiny videos (creator/tools/video/make_videos.py), animated with CSS and
     recorded like the app. ?kind=title|section|list|end&title=...&sub=...&items=a|b|c&tag=... -->
<html lang="en"><head><meta charset="utf-8"><title>RockShiny card</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d13; color: #eef0f6;
    font-family: Inter, "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% -10%, #1f2844 0%, #0b0d13 62%), #0b0d13; }
  .grid { position: fixed; inset: 0; opacity: .22; background-image:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 70%);
    transform: perspective(600px) rotateX(58deg) translateY(180px) scale(2.2); animation: drift 8s linear infinite; }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 0 128px; } }
  .strings { position: fixed; left: 0; right: 0; bottom: 14%; display: flex; flex-direction: column; gap: 10px; opacity: .55; }
  .strings i { display: block; height: 3px; border-radius: 2px; transform-origin: left; animation: str 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .strings i:nth-child(1) { background: #e8203a; animation-delay: .05s; } .strings i:nth-child(2) { background: #f2d40c; animation-delay: .1s; }
  .strings i:nth-child(3) { background: #1f9cf0; animation-delay: .15s; } .strings i:nth-child(4) { background: #f5891d; animation-delay: .2s; }
  .strings i:nth-child(5) { background: #22c55e; animation-delay: .25s; } .strings i:nth-child(6) { background: #b04ee6; animation-delay: .3s; }
  @keyframes str { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .wrap { position: relative; text-align: center; max-width: 980px; padding: 0 40px; }
  .logo { width: 96px; height: 96px; margin: 0 auto 18px; animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; filter: drop-shadow(0 0 28px rgba(245,165,36,.55)); }
  @keyframes pop { from { transform: scale(.4) rotate(-18deg); opacity: 0; } to { transform: none; opacity: 1; } }
  h1 { margin: 0; font-size: 76px; font-weight: 850; letter-spacing: -.03em; line-height: 1.05; animation: rise .7s .15s ease-out both; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ffc46b, #f08a00); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { display: inline-block; margin-bottom: 14px; padding: 5px 12px; border-radius: 8px; background: #f5a524; color: #1a1206; font-weight: 800;
    font-size: 15px; letter-spacing: .1em; text-transform: uppercase; animation: rise .6s ease-out both; }
  p.sub { margin: 16px 0 0; font-size: 26px; color: rgba(232,234,241,.75); font-weight: 500; animation: rise .7s .3s ease-out both; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  .chips span { padding: 8px 16px; border-radius: 999px; font-size: 17px; font-weight: 700; color: rgba(238,240,246,.88);
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); animation: rise .6s ease-out both; }
  ul.list { list-style: none; margin: 26px auto 0; padding: 0; text-align: left; max-width: 860px; display: grid; gap: 10px; }
  ul.list li { display: block; font-size: 23px; line-height: 1.35; color: rgba(232,234,241,.88);
    padding: 10px 16px; border-radius: 12px; background: rgba(255,255,255,.04); box-shadow: inset 3px 0 0 #f5a524; animation: rise .55s ease-out both; }
  ul.list li b { color: #fff; }
  code { font: 700 .85em ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffc46b; background: rgba(255,255,255,.06); padding: 3px 8px; border-radius: 6px; }
  .kind-section h1 { font-size: 64px; }
  .kind-list h1 { font-size: 48px; }
</style></head>
<body>
<div class="grid"></div>
<div class="strings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap" id="wrap"></div>
<script>
  const q = new URLSearchParams(location.search), kind = q.get("kind") || "title";
  const logo = '<svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc46b"/>' +
    '<stop offset="1" stop-color="#f08a00"/></linearGradient></defs><path fill="url(#g)" d="M16 2C9 2 4 5 4 10c0 8 7 17 12 20 5-3 12-12 12-20 0-5-5-8-12-8z"/>' +
    '<path fill="#1a1206" d="M13 9h6v2h-2v9.3a3 3 0 1 1-2-2.8V11h-2z"/></svg>';
  const esc = (s) => String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const rich = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*([^*]+)\*/g, "<b>$1</b>").replace(/_([^_]+)_/g, "<em>$1</em>");
  document.body.classList.add("kind-" + kind);
  let h = "";
  if (kind !== "list") h += logo;
  if (q.get("tag")) h += '<div class="tag">' + esc(q.get("tag")) + "</div>";
  h += "<h1>" + rich(q.get("title")) + "</h1>";
  if (q.get("sub")) h += '<p class="sub">' + rich(q.get("sub")) + "</p>";
  const items = (q.get("items") || "").split("|").filter(Boolean);
  if (kind === "list") h += '<ul class="list">' + items.map((x, i) => '<li style="animation-delay:' + (0.35 + i * 0.22) + 's">' + rich(x) + "</li>").join("") + "</ul>";
  else if (items.length) h += '<div class="chips">' + items.map((x, i) => '<span style="animation-delay:' + (0.45 + i * 0.12) + 's">' + rich(x) + "</span>").join("") + "</div>";
  document.getElementById("wrap").innerHTML = h;
</script>
</body></html>
