.rsc-lv:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

.rsc-lvlist { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; scrollbar-width: thin; }
.rsc-lvrow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 20px; align-items: center; gap: 8px; min-height: 24px; padding: 2px 6px; border: 0; border-radius: 6px;
  background: transparent; color: rgba(232, 234, 241, 0.78); font-size: 11.5px; text-align: left; cursor: pointer; }
.rsc-lvrow:hover { background: rgba(255, 255, 255, 0.06); }
.rsc-lvrow.is-on { background: rgba(245, 165, 36, 0.12); color: #fff; }
.rsc-lvrow span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsc-lvrow small { color: var(--rs-muted); }
.rsc-lvrow i { display: block; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.rsc-lvrow i b { display: block; height: 100%; background: linear-gradient(90deg, #f08a00, #ffc46b); border-radius: 3px; }
.rsc-lvrow em { font-style: normal; font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; color: var(--rs-accent-hi); }
.rsc-head.is-level .rsc-head-sub { color: var(--rs-accent-hi); }
.rsc-insp-tabs button { padding: 0 2px; }

.rsc-muted { color: var(--rs-muted); font-weight: 500; }
.rsc-help-link { float: right; font-size: 11px; font-weight: 650; margin-top: 2px; }
.rsc-lvcard { font-size: 11.5px; line-height: 1.5; padding: 8px 10px; border-radius: 9px; margin-bottom: 12px; color: rgba(232, 234, 241, 0.78);
  background: rgba(245, 165, 36, 0.07); box-shadow: inset 0 0 0 1px rgba(245, 165, 36, 0.22); }
.rsc-lvcard b { color: #fff; }
.rsc-step { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 12.5px; }
.rsc-step-n { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--rs-accent); color: #1a1206; font-size: 11px; font-weight: 800; }
.rsc-choices { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.rsc-choice { display: flex; gap: 9px; align-items: flex-start; text-align: left; padding: 8px 10px; border-radius: 9px; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, 0.035); color: rgba(232, 234, 241, 0.8); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
.rsc-choice:hover { background: rgba(255, 255, 255, 0.07); }
.rsc-choice i { flex: none; width: 14px; height: 14px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(232, 234, 241, 0.4); }
.rsc-choice.is-on { background: rgba(245, 165, 36, 0.1); box-shadow: inset 0 0 0 1px rgba(245, 165, 36, 0.45); }
.rsc-choice.is-on i { box-shadow: inset 0 0 0 4px var(--rs-accent); }
.rsc-choice b { display: block; font-size: 12px; color: #fff; }
.rsc-choice small { display: block; font-size: 11px; line-height: 1.4; color: var(--rs-muted); margin-top: 1px; }

/* ---- help dialog and guided tour (appended to <body>, outside the studio) ---- */
.rsc-help-backdrop, .rsc-tour {
  --rs-accent: #f5a524; --rs-accent-hi: #ffc46b; --rs-text: #eef0f6; --rs-muted: #9aa3b8; --rs-line: rgba(255, 255, 255, 0.09);
  --rs-font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-family: var(--rs-font); color: var(--rs-text); font-size: 13px; line-height: 1.5;
}
.rsc-help-backdrop { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 24px; background: rgba(5, 7, 12, 0.62);
  backdrop-filter: blur(3px); opacity: 0; transition: opacity 0.18s; }
.rsc-help-backdrop.is-on { opacity: 1; }
.rsc-help { width: min(760px, 100%); max-height: min(640px, calc(100vh - 48px)); display: flex; flex-direction: column; border-radius: 16px; outline: none; overflow: hidden;
  background: linear-gradient(180deg, #151a27, #0e121b); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.rsc-help header { flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
.rsc-help header b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.rsc-help header small { display: block; font-size: 12px; color: var(--rs-muted); }
.rsc-help header > div { flex: 1; min-width: 0; }
.rsc-help-logo { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #ffc46b, #f08a00); }
.rsc-help-logo svg { width: 20px; height: 20px; fill: #1a1206; }
.rsc-help-x { flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
.rsc-help-x:hover { background: rgba(255, 255, 255, 0.12); }
.rsc-help-nav { flex: none; display: flex; gap: 4px; padding: 0 18px 10px; border-bottom: 1px solid var(--rs-line); overflow-x: auto; }
.rsc-help-nav button { flex: none; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: rgba(232, 234, 241, 0.65);
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.rsc-help-nav button:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
.rsc-help-nav button.is-on { background: rgba(245, 165, 36, 0.16); color: var(--rs-accent-hi); }
.rsc-help-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 8px; scrollbar-width: thin; }
.rsc-help-body h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.rsc-help-body h4 { margin: 14px 0 4px; font-size: 13.5px; }
.rsc-help-body p, .rsc-help-body li { color: rgba(232, 234, 241, 0.82); }
.rsc-help-body ul, .rsc-help-body ol { margin: 4px 0 0; padding-left: 18px; }
.rsc-help-body li { margin: 2px 0; }
.rsc-help-body code { font-size: 12px; color: var(--rs-accent-hi); }
.rsc-help-body kbd, .rsc-tour kbd { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; font: 700 11px/18px ui-monospace, SFMono-Regular, Menlo, monospace;
  text-align: center; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.12); color: #fff; }
.rsc-help-lead { font-size: 14px; margin: 0 0 12px; }
.rsc-help-note { font-size: 12px; color: var(--rs-muted) !important; margin: 12px 0 4px; }
.rsc-help-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rsc-help-steps > div { padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.035); box-shadow: inset 0 0 0 1px var(--rs-line); }
.rsc-help-steps span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--rs-accent); color: #1a1206; font-weight: 800; font-size: 12px; margin-bottom: 6px; }
.rsc-help-steps b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.rsc-help-steps p { margin: 0; font-size: 12.5px; }
.rsc-help-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.rsc-help-grid > div { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.035); box-shadow: inset 0 0 0 1px var(--rs-line); }
.rsc-help-grid b { font-size: 13px; color: var(--rs-accent-hi); }
.rsc-help-grid li { font-size: 12.5px; }
.rsc-help-limits { display: flex; flex-direction: column; gap: 6px; }
.rsc-help-limits > div { padding: 8px 12px; border-radius: 10px; font-size: 12.5px; color: rgba(232, 234, 241, 0.8); background: rgba(255, 255, 255, 0.03);
  box-shadow: inset 3px 0 0 rgba(245, 165, 36, 0.7); }
.rsc-help-limits b { color: #fff; }
.rsc-help-levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 12px; }
.rsc-help-levels > div { padding: 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.035); }
.rsc-help-levels span { display: block; font-size: 11px; font-weight: 750; color: var(--rs-muted); margin-bottom: 6px; }
.rsc-help-levels i { display: flex; gap: 3px; }
.rsc-help-levels b, .rsc-help-levels em { flex: 1; height: 14px; border-radius: 3px; }
.rsc-help-levels b { background: linear-gradient(180deg, #ffc46b, #f08a00); }
.rsc-help-levels em { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); border: 1px dashed rgba(255, 255, 255, 0.16); }
.rsc-help-keys { grid-template-columns: auto 1fr auto 1fr; }
.rsc-help footer { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--rs-line); }
.rsc-help-btn { height: 34px; padding: 0 16px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, 0.12); background: #1a1f2e; color: #e8eaf1; font: inherit; font-weight: 700; cursor: pointer; }
.rsc-help-btn:hover { background: #222839; }
.rsc-help-btn.is-accent { background: var(--rs-accent); border-color: var(--rs-accent); color: #1a1206; box-shadow: 0 0 16px rgba(245, 165, 36, 0.3); }
.rsc-help-btn.is-accent:hover { background: #ffb739; }
@media (max-width: 640px) { .rsc-help-steps, .rsc-help-grid, .rsc-help-levels { grid-template-columns: 1fr; } .rsc-help-keys { grid-template-columns: auto 1fr; } }

.rsc-tour { position: fixed; inset: 0; z-index: 10000; }
.rsc-tour-spot { position: fixed; border-radius: 12px; pointer-events: none; transition: all 0.25s ease;
  box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.66), 0 0 0 2px var(--rs-accent), 0 0 28px rgba(245, 165, 36, 0.45); }
.rsc-tour.is-center .rsc-tour-spot { box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.66); }
.rsc-help-backdrop *, .rsc-tour * { box-sizing: border-box; }
.rsc-tour-card { position: fixed; width: 360px; box-sizing: border-box; padding: 14px 16px 12px; border-radius: 14px; transition: left 0.25s ease, top 0.25s ease;
  background: linear-gradient(180deg, #1a2030, #121722); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(245, 165, 36, 0.35); }
.rsc-tour.is-center .rsc-tour-card { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); }
.rsc-tour-count { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--rs-accent-hi); }
.rsc-tour-card h4 { margin: 2px 0 6px; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.rsc-tour-card p { margin: 0 0 12px; font-size: 13px; color: rgba(232, 234, 241, 0.85); }
.rsc-tour-card code { font-size: 12px; color: var(--rs-accent-hi); }
.rsc-tour-btns { display: flex; align-items: center; gap: 6px; }
.rsc-tour-btns span { flex: 1; }
.rsc-tour-btns button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12); background: #1a1f2e; color: #e8eaf1;
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.rsc-tour-btns button:disabled { opacity: 0.4; cursor: default; }
.rsc-tour-btns button.is-accent { background: var(--rs-accent); border-color: var(--rs-accent); color: #1a1206; }
.rsc-tour-btns button[data-tour="end"] { background: transparent; border-color: transparent; color: var(--rs-muted); padding: 0 4px; }
.rsc-empty-btns { display: flex; gap: 8px; margin-top: 14px; }
.rsc-helpbtn svg { fill: var(--rs-accent-hi); }
.rsc-studio.is-touring .rsc-empty { display: none; }

/* ---- the tuner (rsc-fill.js): a floating card over the timeline ---- */
.rsc-tuner { position: absolute; right: calc(var(--rsc-insp-w) + 26px); top: 78px; z-index: 7; width: 250px; padding: 12px 14px; border-radius: 14px;
  background: rgba(14, 17, 26, 0.94); backdrop-filter: blur(10px); box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(245, 165, 36, 0.35); }
.rsc-studio.no-inspector .rsc-tuner, .rsc-studio.is-compact .rsc-tuner { right: 16px; }
.rsc-tuner-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.rsc-tuner-head b { font-size: 13px; font-weight: 800; color: var(--rs-accent-hi); letter-spacing: 0.04em; text-transform: uppercase; }
.rsc-tuner-head span { flex: 1; min-width: 0; font-size: 11.5px; color: var(--rs-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsc-tuner-x { border: 0; background: rgba(255, 255, 255, 0.06); color: #fff; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
.rsc-tuner-note { text-align: center; margin: 4px 0 2px; }
.rsc-tuner-note span { display: block; font-size: 40px; font-weight: 850; letter-spacing: -0.02em; line-height: 1.05; color: #fff; font-variant-numeric: tabular-nums; }
.rsc-tuner-note small { display: block; min-height: 15px; font-size: 11.5px; color: var(--rs-muted); font-variant-numeric: tabular-nums; }
.rsc-tuner-meter { position: relative; height: 10px; margin: 6px 2px 10px; border-radius: 5px;
  background: linear-gradient(90deg, rgba(232, 32, 58, 0.35), rgba(245, 165, 36, 0.25) 40%, rgba(70, 200, 120, 0.5) 50%, rgba(245, 165, 36, 0.25) 60%, rgba(232, 32, 58, 0.35)); }
.rsc-tuner-meter em { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(255, 255, 255, 0.5); }
.rsc-tuner-meter i { position: absolute; left: 50%; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--rs-accent); transition: left 0.08s linear; }
.rsc-tuner-meter i.is-ok { background: #46c878; box-shadow: 0 0 10px rgba(70, 200, 120, 0.7); }
.rsc-tuner-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--rs-muted); margin-bottom: 8px; }
.rsc-tuner-row input { width: 64px; height: 24px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.12); background: #121622; color: #fff; padding: 0 6px; font: inherit; }
.rsc-tuner-lbl { width: 52px; font-weight: 700; }
.rsc-tuner-level { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.rsc-tuner-level i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #46c878, #f5a524); }
.rsc-tuner-seg { display: flex; gap: 3px; padding: 3px; margin-bottom: 8px; border-radius: 9px; background: rgba(255, 255, 255, 0.04); }
.rsc-tuner-seg button { flex: 1; height: 26px; border: 0; border-radius: 6px; background: transparent; color: rgba(232, 234, 241, 0.7); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; }
.rsc-tuner-seg button.is-on { background: var(--rs-accent); color: #1a1206; }
.rsc-tuner-hint { font-size: 11px; line-height: 1.4; color: rgba(232, 234, 241, 0.55); }
/* RockShiny Creator as one offline page (creator_build_html()): the app chrome
   around the studio, after the RockShiny app's navbar and sidebars (app.css). */
html, body { height: 100%; margin: 0; }
body.rscp { display: flex; flex-direction: column; color: #e8eaf1; font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(ellipse at 70% -10%, #1a2035 0%, #0b0d13 55%) fixed #0b0d13; }
.rscp-bar { flex: none; display: flex; align-items: center; gap: 18px; padding: 0 16px; height: 56px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(11,13,19,.6); }
.rscp-brand { display: flex; align-items: center; gap: 10px; }
.rscp-logo { width: 28px; height: 28px; filter: drop-shadow(0 2px 6px rgba(245,165,36,.35)); }
.rscp-name { font-weight: 800; letter-spacing: -0.02em; font-size: 1.15rem; }
.rscp-tag { font-weight: 800; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #1a1206; background: #f5a524; border-radius: 6px; padding: 2px 6px; }
.rscp-sub { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: rgba(232,234,241,.45); margin-top: 3px; }
.rscp-pill { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: rgba(255,255,255,.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.rscp-pill span { padding: .32rem .95rem; border-radius: 8px; font-weight: 650; font-size: .85rem; color: rgba(232,234,241,.62); }
.rscp-pill span.is-on { color: #1a1206; background: #f5a524; box-shadow: 0 0 16px rgba(245,165,36,.3); }
.rscp-spacer { flex: 1; }
.rscp-help { height: 28px; padding: 0 12px; margin-right: 8px; border-radius: 999px; border: 1px solid rgba(245,165,36,.4); background: rgba(245,165,36,.1);
  color: #ffc46b; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.rscp-help:hover { background: rgba(245,165,36,.2); }
.rscp-offline { font-size: 11.5px; font-weight: 700; color: #8fe39f; background: rgba(70,200,120,.12); padding: 3px 10px; border-radius: 999px; }
.rscp-main { flex: 1; min-height: 0; display: flex; }
.rscp-side { flex: none; width: 320px; overflow-y: auto; padding: 16px 16px 24px; background: rgba(16,19,27,.85); border-right: 1px solid rgba(255,255,255,.06); box-sizing: border-box; }
.rscp-stage { flex: 1; min-width: 0; padding: 14px; display: flex; }
.rscp-stage > .rsc-host { flex: 1; }
/* sidebar: accordion sections like the app's (.rs-accordion) */
.rscp-sec { border-bottom: 1px solid rgba(255,255,255,.06); }
.rscp-sec > summary { list-style: none; cursor: pointer; padding: .65rem 0; font-weight: 700; font-size: .84rem; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.rscp-sec > summary::-webkit-details-marker { display: none; }
.rscp-sec > summary svg { width: 15px; height: 15px; fill: rgba(232,234,241,.55); }
.rscp-sec[open] > summary { color: #f5a524; }
.rscp-sec[open] > summary svg { fill: #f5a524; }
.rscp-sec > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid rgba(232,234,241,.4); border-bottom: 2px solid rgba(232,234,241,.4); transform: rotate(45deg); transition: transform .2s; }
.rscp-sec[open] > summary::after { transform: rotate(-135deg); }
.rscp-body { padding: .2rem 0 1rem; }
.rscp-label { display: block; font-size: .78rem; font-weight: 600; color: rgba(232,234,241,.72); margin-bottom: .3rem; }
.rscp-fieldset { margin-bottom: .85rem; }
.rscp-input, .rscp-select { width: 100%; box-sizing: border-box; height: 34px; border-radius: .55rem; border: 1px solid rgba(255,255,255,.10); background: #141824; color: #e8eaf1; font: inherit; font-size: 13px; padding: 0 10px; }
.rscp-input:focus, .rscp-select:focus { outline: none; border-color: rgba(245,165,36,.6); }
.rscp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rscp-checks { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.rscp-checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.rscp-checks input { accent-color: #f5a524; }
.rscp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: .55rem; border: 1px solid rgba(255,255,255,.12);
  background: #1a1f2e; color: #e8eaf1; font: 650 13px/1 inherit; font-family: inherit; cursor: pointer; width: 100%; margin-bottom: 8px; }
.rscp-btn:hover { background: #222839; }
.rscp-btn:disabled { opacity: .45; cursor: default; }
.rscp-btn.is-primary { background: #f5a524; border-color: #f5a524; color: #1a1206; box-shadow: 0 0 16px rgba(245,165,36,.25); }
.rscp-btn.is-primary:hover { background: #ffb739; }
.rscp-btn svg { width: 16px; height: 16px; fill: currentColor; }
.rscp-seg { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); margin-bottom: 10px; }
.rscp-seg button { flex: 1; height: 30px; border: 0; border-radius: 7px; background: transparent; color: rgba(232,234,241,.62); font: 650 12.5px/1 inherit; font-family: inherit; cursor: pointer; }
.rscp-seg button.is-on { background: #f5a524; color: #1a1206; }
.rscp-hint { font-size: .76rem; line-height: 1.45; color: rgba(232,234,241,.5); margin: -.2rem 0 .75rem; }
.rscp-hint code { color: #ffc46b; }
.rscp-report { font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); margin-bottom: 10px; }
.rscp-report.is-ok { color: #bff0c8; box-shadow: inset 0 0 0 1px rgba(70,200,120,.3); }
.rscp-report.is-error { color: #ffc2ba; box-shadow: inset 0 0 0 1px rgba(255,110,95,.35); }

<script>/* rsc-core.js */
/* ---------------------------------------------------------------------------
 * rsc-core.js -- RockShiny Creator engine: shared helpers.
 *
 * The engine (rsc-*.js in this folder) is the one codec of the Creator: the
 * Shiny app and the standalone HTML page both run it in the browser, and the
 * tests run it under Node. It has no dependencies and touches no DOM.
 *
 *   RSCreator.engine.Reader / Writer   little/big-endian binary cursor
 *   RSCreator.engine.md5(bytes)         -> Uint8Array(16)
 *   RSCreator.engine.crc32ogg(bytes)    Ogg page checksum
 *   RSCreator.engine.fnv1_32(text)      Wwise object ids (lower-cased FNV-1)
 *   RSCreator.engine.inflate / deflate  zlib streams (async)
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const RSC = (root.RSCreator = root.RSCreator || {});
  const E = (RSC.engine = RSC.engine || {});

  // ---- text ---------------------------------------------------------------------------
  const te = new TextEncoder(), td = new TextDecoder("utf-8");
  E.utf8 = (s) => te.encode(String(s));
  E.fromUtf8 = (u8) => td.decode(u8);
  E.latin1 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return s; };

  E.concat = function (parts) {
    let n = 0;
    for (const p of parts) n += p.length;
    const out = new Uint8Array(n);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  };
  E.equalBytes = function (a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  };
  E.hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, "0")).join("");
  E.fromHex = function (h) {
    h = String(h).replace(/[^0-9a-f]/gi, "");
    const out = new Uint8Array(h.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(2 * i, 2), 16);
    return out;
  };

  // ---- base64 (chunked: large buffers) -------------------------------------------------------
  const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  const B64R = new Int16Array(256).fill(-1);
  for (let i = 0; i < 64; i++) B64R[B64.charCodeAt(i)] = i;
  E.toBase64 = function (u8) {
    const parts = [];
    for (let i = 0; i < u8.length; i += 3 * 16384) {
      const end = Math.min(u8.length, i + 3 * 16384);
      let s = "";
      for (let j = i; j < end; j += 3) {
        const a = u8[j], b = j + 1 < end ? u8[j + 1] : 0, c = j + 2 < end ? u8[j + 2] : 0;
        s += B64[a >> 2] + B64[((a & 3) << 4) | (b >> 4)] +
             (j + 1 < end ? B64[((b & 15) << 2) | (c >> 6)] : "=") + (j + 2 < end ? B64[c & 63] : "=");
      }
      parts.push(s);
    }
    return parts.join("");
  };
  E.fromBase64 = function (s) {
    s = String(s).replace(/[^A-Za-z0-9+/]/g, "");
    const n = Math.floor(s.length * 3 / 4);
    const out = new Uint8Array(n);
    let o = 0;
    for (let i = 0; i < s.length; i += 4) {
      const a = B64R[s.charCodeAt(i)], b = B64R[s.charCodeAt(i + 1)];
      const c = i + 2 < s.length ? B64R[s.charCodeAt(i + 2)] : -1, d = i + 3 < s.length ? B64R[s.charCodeAt(i + 3)] : -1;
      out[o++] = (a << 2) | (b >> 4);
      if (c >= 0 && o < n) out[o++] = ((b & 15) << 4) | (c >> 2);
      if (d >= 0 && o < n) out[o++] = ((c & 3) << 6) | d;
    }
    return out.subarray(0, o);
  };

  // ---- binary cursor ---------------------------------------------------------------------
  class Reader {
    constructor(u8, pos = 0, little = true) {
      this.u8 = u8; this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      this.pos = pos; this.le = little;
    }
    get left() { return this.u8.length - this.pos; }
    u8v() { return this.u8[this.pos++]; }
    i8() { const v = this.dv.getInt8(this.pos); this.pos += 1; return v; }
    u16() { const v = this.dv.getUint16(this.pos, this.le); this.pos += 2; return v; }
    i16() { const v = this.dv.getInt16(this.pos, this.le); this.pos += 2; return v; }
    u32() { const v = this.dv.getUint32(this.pos, this.le); this.pos += 4; return v; }
    i32() { const v = this.dv.getInt32(this.pos, this.le); this.pos += 4; return v; }
    f32() { const v = this.dv.getFloat32(this.pos, this.le); this.pos += 4; return v; }
    f64() { const v = this.dv.getFloat64(this.pos, this.le); this.pos += 8; return v; }
    bytes(n) { const v = this.u8.subarray(this.pos, this.pos + n); this.pos += n; return v; }
    /** Zero-terminated string in a fixed-width field (UTF-8). */
    cstr(width) {
      const b = this.bytes(width);
      let n = b.indexOf(0);
      if (n < 0) n = b.length;
      return td.decode(b.subarray(0, n));
    }
    skip(n) { this.pos += n; return this; }
  }
  E.Reader = Reader;

  class Writer {
    constructor(size = 1 << 16, little = true) {
      this.buf = new Uint8Array(size); this.dv = new DataView(this.buf.buffer); this.pos = 0; this.le = little;
    }
    ensure(n) {
      if (this.pos + n <= this.buf.length) return;
      let size = this.buf.length * 2;
      while (size < this.pos + n) size *= 2;
      const b = new Uint8Array(size);
      b.set(this.buf.subarray(0, this.pos));
      this.buf = b; this.dv = new DataView(b.buffer);
    }
    u8(v) { this.ensure(1); this.buf[this.pos++] = v & 255; return this; }
    i8(v) { this.ensure(1); this.dv.setInt8(this.pos, v); this.pos += 1; return this; }
    u16(v) { this.ensure(2); this.dv.setUint16(this.pos, v, this.le); this.pos += 2; return this; }
    i16(v) { this.ensure(2); this.dv.setInt16(this.pos, v, this.le); this.pos += 2; return this; }
    u32(v) { this.ensure(4); this.dv.setUint32(this.pos, v >>> 0, this.le); this.pos += 4; return this; }
    i32(v) { this.ensure(4); this.dv.setInt32(this.pos, v, this.le); this.pos += 4; return this; }
    f32(v) { this.ensure(4); this.dv.setFloat32(this.pos, v, this.le); this.pos += 4; return this; }
    f64(v) { this.ensure(8); this.dv.setFloat64(this.pos, v, this.le); this.pos += 8; return this; }
    bytes(u8) { this.ensure(u8.length); this.buf.set(u8, this.pos); this.pos += u8.length; return this; }
    zeros(n) { this.ensure(n); this.buf.fill(0, this.pos, this.pos + n); this.pos += n; return this; }
    /** Fixed-width zero-padded string field (UTF-8, truncated to width - 1 bytes). */
    cstr(s, width) {
      let b = te.encode(String(s == null ? "" : s));
      if (b.length > width - 1) {
        let n = width - 1;
        while (n > 0 && (b[n] & 0xc0) === 0x80) n--;          // do not cut a UTF-8 sequence
        b = b.subarray(0, n);
      }
      this.bytes(b); this.zeros(width - b.length);
      return this;
    }
    /** Big-endian unsigned integer of `n` bytes (PSARC's 40-bit fields). */
    uintBE(v, n) { this.ensure(n); for (let i = n - 1; i >= 0; i--) { this.buf[this.pos + i] = v % 256; v = Math.floor(v / 256); } this.pos += n; return this; }
    result() { return this.buf.slice(0, this.pos); }
  }
  E.Writer = Writer;

  E.readUintBE = function (u8, off, n) { let v = 0; for (let i = 0; i < n; i++) v = v * 256 + u8[off + i]; return v; };

  // ---- MD5 (RFC 1321) -----------------------------------------------------------------------
  const MD5_S = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
    4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21];
  const MD5_K = new Int32Array(64);
  for (let i = 0; i < 64; i++) MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
  E.md5 = function (input) {
    const msg = typeof input === "string" ? te.encode(input) : input;
    const n = msg.length, total = ((n + 8) >>> 6) + 1, words = new Int32Array(total * 16);
    for (let i = 0; i < n; i++) words[i >> 2] |= msg[i] << ((i % 4) * 8);
    words[n >> 2] |= 0x80 << ((n % 4) * 8);
    words[total * 16 - 2] = (n * 8) | 0;
    words[total * 16 - 1] = Math.floor(n / 536870912) | 0;
    let a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;
    for (let blk = 0; blk < total * 16; blk += 16) {
      let A = a0, B = b0, C = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & C) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) & 15; }
        else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) & 15; }
        else { F = C ^ (B | ~D); g = (7 * i) & 15; }
        const tmp = D; D = C; C = B;
        const x = (A + F + MD5_K[i] + words[blk + g]) | 0;
        B = (B + ((x << MD5_S[i]) | (x >>> (32 - MD5_S[i])))) | 0;
        A = tmp;
      }
      a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
    }
    const out = new Uint8Array(16), dv = new DataView(out.buffer);
    dv.setInt32(0, a0, true); dv.setInt32(4, b0, true); dv.setInt32(8, c0, true); dv.setInt32(12, d0, true);
    return out;
  };

  // ---- CRC-32 of Ogg pages (polynomial 0x04c11db7, not reflected, init 0) --------------------
  const OGG_CRC = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let r = i << 24;
    for (let k = 0; k < 8; k++) r = r & 0x80000000 ? (r << 1) ^ 0x04c11db7 : r << 1;
    OGG_CRC[i] = r >>> 0;
  }
  E.crc32ogg = function (u8, from = 0, to = u8.length) {
    let c = 0;
    for (let i = from; i < to; i++) c = ((c << 8) ^ OGG_CRC[((c >>> 24) ^ u8[i]) & 255]) >>> 0;
    return c >>> 0;
  };

  // ---- Wwise ids: FNV-1 32-bit of the lower-cased name -------------------------------------------
  E.fnv1_32 = function (name) {
    const b = te.encode(String(name).toLowerCase());
    let h = 0x811c9dc5;
    for (let i = 0; i < b.length; i++) { h = Math.imul(h, 0x01000193) >>> 0; h = (h ^ b[i]) >>> 0; }
    return h >>> 0;
  };

  // ---- zlib (RFC 1950) -------------------------------------------------------------------------
  // Browsers: (De)CompressionStream("deflate") (= zlib format). Node and tests may
  // install synchronous implementations as RSCreator.engine.zlibImpl = {inflate, deflate}.
  async function streamThrough(u8, stream) {
    const blob = new Blob([u8]);
    const out = await new Response(blob.stream().pipeThrough(stream)).arrayBuffer();
    return new Uint8Array(out);
  }
  E.inflate = async function (u8) {
    if (E.zlibImpl) return E.zlibImpl.inflate(u8);
    return streamThrough(u8, new DecompressionStream("deflate"));
  };
  /**
   * Inflate a zlib stream that may be followed by other bytes (SNG files carry a
   * signature and padding after it, which the browser's strict DecompressionStream
   * rejects): the input goes in in small pieces and the output produced before the
   * complaint about the trailing bytes is kept. -> Uint8Array
   */
  E.inflateLenient = async function (u8) {
    if (E.zlibImpl) return E.zlibImpl.inflate(u8);
    const ds = new DecompressionStream("deflate"), w = ds.writable.getWriter(), r = ds.readable.getReader();
    const chunks = [];
    let n = 0;
    const reading = (async () => {
      try { for (;;) { const { done, value } = await r.read(); if (done) break; chunks.push(value); n += value.length; } } catch (e) { /* trailing bytes */ }
    })();
    try { for (let i = 0; i < u8.length; i += 4096) await w.write(u8.subarray(i, Math.min(u8.length, i + 4096))); await w.close(); } catch (e) { /* trailing bytes */ }
    await reading;
    const out = new Uint8Array(n);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  };
  E.deflate = async function (u8) {
    if (E.zlibImpl) return E.zlibImpl.deflate(u8);
    return streamThrough(u8, new CompressionStream("deflate"));
  };
  /** A zlib stream header? (CMF 0x78 and a valid FCHECK) */
  E.looksZlib = (u8) => u8.length >= 2 && u8[0] === 0x78 && ((0x78 * 256 + u8[1]) % 31) === 0;

  /** Yield to the event loop (long jobs keep the page responsive). */
  E.tick = () => new Promise((res) => setTimeout(res, 0));
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* rsc-aes.js */
/* ---------------------------------------------------------------------------
 * rsc-aes.js -- the two AES modes of Rocksmith 2014, in plain JS (synchronous,
 * no WebCrypto: works the same from file://, in workers and under Node).
 *
 *   PSARC table of contents : AES-256-CFB128, fixed public key + IV
 *   SNG note charts         : AES-256-CTR, platform key, IV stored in the file
 *
 * Both modes only ever use the forward cipher E_k, so only encryption is built.
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const E = root.RSCreator.engine;

  E.KEYS = {
    psarcKey: "C53DB23870A1A2F71CAE64061FDD0E1157309DC85204D4C5BFDF25090DF2572C",
    psarcIV: "E915AA018FEF71FC508132E4BB4CEB42",
    sngMac: "9821330E34B91F70D0A48CBD625993126970CEA09192C0E6CDA676CC9838289D",
    sngPC: "CB648DF3D12A16BF71701414E69619EC171CCA5D2A142E3E59DE7ADDA18A3A30"
  };

  // ---- tables ------------------------------------------------------------------------------
  const SBOX = new Uint8Array(256), T0 = new Uint32Array(256), T1 = new Uint32Array(256),
    T2 = new Uint32Array(256), T3 = new Uint32Array(256);
  (function build() {
    // generator walk as in SJCL: x runs over GF(2^8) by x *= 3, xi = x^-1 (th: 3x -> x)
    const d = new Uint8Array(256), th = new Uint8Array(256);
    for (let i = 0; i < 256; i++) { d[i] = (i << 1) ^ ((i >> 7) * 0x11b); th[d[i] ^ i] = i; }
    let x = 0, xi = 0;
    for (let k = 0; k < 256; k++) {
      let s = xi ^ (xi << 1) ^ (xi << 2) ^ (xi << 3) ^ (xi << 4);
      s = (s >> 8) ^ (s & 255) ^ 0x63;
      SBOX[x] = s;
      const x2 = d[x];
      const t = (d[s] * 0x101) ^ (s * 0x1010100);
      T0[x] = ((t << 24) | (t >>> 8)) >>> 0;
      T1[x] = ((t << 16) | (t >>> 16)) >>> 0;
      T2[x] = ((t << 8) | (t >>> 24)) >>> 0;
      T3[x] = t >>> 0;
      x ^= x2 || 1;
      xi = th[xi] || 1;
    }
  })();

  /** Expanded key (Uint32 words) of a 16/24/32-byte key. */
  function expandKey(key) {
    const nk = key.length / 4, rounds = nk + 6, w = new Uint32Array(4 * (rounds + 1));
    for (let i = 0; i < nk; i++) w[i] = (key[4 * i] << 24 | key[4 * i + 1] << 16 | key[4 * i + 2] << 8 | key[4 * i + 3]) >>> 0;
    let rcon = 1;
    for (let i = nk; i < w.length; i++) {
      let t = w[i - 1];
      if (i % nk === 0) {
        t = (SBOX[(t >>> 16) & 255] << 24 | SBOX[(t >>> 8) & 255] << 16 | SBOX[t & 255] << 8 | SBOX[t >>> 24]) ^ (rcon << 24);
        rcon = (rcon << 1) ^ ((rcon >> 7) * 0x11b);
      } else if (nk > 6 && i % nk === 4) {
        t = SBOX[t >>> 24] << 24 | SBOX[(t >>> 16) & 255] << 16 | SBOX[(t >>> 8) & 255] << 8 | SBOX[t & 255];
      }
      w[i] = (w[i - nk] ^ t) >>> 0;
    }
    return { w, rounds };
  }

  /** E_k(in[inOff..+16]) -> out[outOff..+16] */
  function encryptBlock(ks, inp, inOff, out, outOff) {
    const w = ks.w;
    let s0 = ((inp[inOff] << 24) | (inp[inOff + 1] << 16) | (inp[inOff + 2] << 8) | inp[inOff + 3]) ^ w[0];
    let s1 = ((inp[inOff + 4] << 24) | (inp[inOff + 5] << 16) | (inp[inOff + 6] << 8) | inp[inOff + 7]) ^ w[1];
    let s2 = ((inp[inOff + 8] << 24) | (inp[inOff + 9] << 16) | (inp[inOff + 10] << 8) | inp[inOff + 11]) ^ w[2];
    let s3 = ((inp[inOff + 12] << 24) | (inp[inOff + 13] << 16) | (inp[inOff + 14] << 8) | inp[inOff + 15]) ^ w[3];
    let k = 4;
    for (let r = 1; r < ks.rounds; r++) {
      const t0 = T0[s0 >>> 24] ^ T1[(s1 >>> 16) & 255] ^ T2[(s2 >>> 8) & 255] ^ T3[s3 & 255] ^ w[k];
      const t1 = T0[s1 >>> 24] ^ T1[(s2 >>> 16) & 255] ^ T2[(s3 >>> 8) & 255] ^ T3[s0 & 255] ^ w[k + 1];
      const t2 = T0[s2 >>> 24] ^ T1[(s3 >>> 16) & 255] ^ T2[(s0 >>> 8) & 255] ^ T3[s1 & 255] ^ w[k + 2];
      const t3 = T0[s3 >>> 24] ^ T1[(s0 >>> 16) & 255] ^ T2[(s1 >>> 8) & 255] ^ T3[s2 & 255] ^ w[k + 3];
      s0 = t0; s1 = t1; s2 = t2; s3 = t3; k += 4;
    }
    const o = [
      (SBOX[s0 >>> 24] << 24 | SBOX[(s1 >>> 16) & 255] << 16 | SBOX[(s2 >>> 8) & 255] << 8 | SBOX[s3 & 255]) ^ w[k],
      (SBOX[s1 >>> 24] << 24 | SBOX[(s2 >>> 16) & 255] << 16 | SBOX[(s3 >>> 8) & 255] << 8 | SBOX[s0 & 255]) ^ w[k + 1],
      (SBOX[s2 >>> 24] << 24 | SBOX[(s3 >>> 16) & 255] << 16 | SBOX[(s0 >>> 8) & 255] << 8 | SBOX[s1 & 255]) ^ w[k + 2],
      (SBOX[s3 >>> 24] << 24 | SBOX[(s0 >>> 16) & 255] << 16 | SBOX[(s1 >>> 8) & 255] << 8 | SBOX[s2 & 255]) ^ w[k + 3]
    ];
    for (let i = 0; i < 4; i++) {
      out[outOff + 4 * i] = o[i] >>> 24; out[outOff + 4 * i + 1] = (o[i] >>> 16) & 255;
      out[outOff + 4 * i + 2] = (o[i] >>> 8) & 255; out[outOff + 4 * i + 3] = o[i] & 255;
    }
  }

  const keyOf = (k) => (typeof k === "string" ? E.fromHex(k) : k);
  E.aesEncryptBlock = function (key, block) {
    const out = new Uint8Array(16);
    encryptBlock(expandKey(keyOf(key)), block, 0, out, 0);

      encryptBlock(ks, prev, 0, ksb, 0);

<script>/* rsc-psarc.js */
/* ---------------------------------------------------------------------------
 * rsc-psarc.js -- PlayStation ARChive (Rocksmith 2014 flavour): read + write.
 *
 * Layout (big-endian), as in RockShiny's R/psarc.R:
 *   0 "PSAR" | 4 u16 1, u16 4 | 8 "zlib" | 12 u32 toc_length | 16 u32 30
 *   20 u32 entries (entry 0 = the file-name manifest) | 24 u32 65536 block size
 *   28 u32 flags (4 = TOC encrypted with AES-256-CFB)
 *   32 TOC: entries[n] (md5[16] | zindex u32 | length u40 | offset u40), then a
 *      u16 compressed length per 64 KiB block (0 = a full uncompressed block)
 * Files are stored as consecutive blocks from `offset`: zlib, or raw when
 * compression does not pay off.
 *
 *   const arc = await RSCreator.engine.psarcOpen(bytes)   // {header, entries, read(name)}
 *   const out = await RSCreator.engine.psarcWrite([{name, data}, ...])
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const E = root.RSCreator.engine;
  const HEADER = 32, ENTRY = 30, BLOCK = 65536;

  function parseHeader(u8) {
    if (u8.length < HEADER || E.latin1(u8.subarray(0, 4)) !== "PSAR") throw new Error("Not a PSARC archive (no 'PSAR' magic).");
    const r = new E.Reader(u8, 4, false);
    return {
      version: r.u16() + "." + r.u16(), compression: E.latin1(r.bytes(4)), tocLength: r.u32(), entrySize: r.u32(),
      entries: r.u32(), blockSize: r.u32(), flags: r.u32()
    };
  }

  /**
   * Open an archive held in memory. -> {header, entries: [{name, md5, zindex, length,
   * offset}] (without the manifest entry), read(name) -> Promise<Uint8Array>, has(name)}
   */
  E.psarcOpen = async function (u8) {
    const h = parseHeader(u8);
    if (h.compression !== "zlib") throw new Error("Unsupported PSARC compression: " + h.compression);
    let toc = u8.subarray(HEADER, h.tocLength);
    if (h.flags & 4) toc = E.aesCfbDecrypt(toc, E.KEYS.psarcKey, E.KEYS.psarcIV);
    const entries = [];
    for (let i = 0; i < h.entries; i++) {
      const o = i * h.entrySize;
      entries.push({
        md5: E.hex(toc.subarray(o, o + 16)), zindex: E.readUintBE(toc, o + 16, 4),
        length: E.readUintBE(toc, o + 20, 5), offset: E.readUintBE(toc, o + 25, 5)
      });
    }
    const zw = h.blockSize <= 65536 ? 2 : h.blockSize <= 16777216 ? 3 : 4;
    const zraw = toc.subarray(h.entries * h.entrySize);
    const zlengths = new Array(Math.floor(zraw.length / zw));
    for (let i = 0; i < zlengths.length; i++) zlengths[i] = E.readUintBE(zraw, i * zw, zw);

    async function readEntry(e) {
      const parts = [];
      let remaining = e.length, pos = e.offset, z = e.zindex;
      while (remaining > 0) {
        const zlen = zlengths[z++];
        if (zlen === undefined) throw new Error("Corrupt PSARC: block table exhausted");
        let block;
        if (zlen === 0) { block = u8.subarray(pos, pos + h.blockSize); pos += h.blockSize; }
        else {
          const packed = u8.subarray(pos, pos + zlen); pos += zlen;
          block = packed;
          if (E.looksZlib(packed)) { try { block = await E.inflate(packed); } catch (err) { block = packed; } }
        }
        if (!block.length) throw new Error("Corrupt PSARC: empty block");
        if (block.length > remaining) block = block.subarray(0, remaining);
        parts.push(block);
        remaining -= block.length;
      }
      return parts.length === 1 ? parts[0].slice() : E.concat(parts);
    }

    const names = E.fromUtf8(await readEntry(entries[0])).replace(/\r/g, "").split("\n");
    const files = entries.slice(1).map((e, i) => Object.assign({ name: names[i] }, e));
    const byName = new Map(files.map((f) => [f.name, f]));
    return {
      header: h, entries: files, zlengths,
      names: () => files.map((f) => f.name),
      has: (name) => byName.has(name),
      find: (re) => files.map((f) => f.name).filter((n) => re.test(n)),
      read: (name) => {
        const e = byName.get(name);
        if (!e) return Promise.reject(new Error("File not found in archive: " + name));
        return readEntry(e);
      }
    };
  };

  /**
   * Build an archive. files: [{name, data: Uint8Array, compress?: boolean}] in the
   * order they are stored; compress defaults to true except for .wem audio (stored
   * raw, like the toolkit: Vorbis does not deflate). opts.encrypt (default true).
   * -> Promise<Uint8Array>
   */
  E.psarcWrite = async function (files, opts) {
    opts = opts || {};
    const all = [{ name: null, data: E.utf8(files.map((f) => f.name).join("\n")), compress: true }].concat(files);
    const zlengths = [], blobs = [], meta = [];
    for (const f of all) {
      const data = f.data, compress = f.compress != null ? f.compress : !/\.wem$/i.test(f.name || "");
      const zindex = zlengths.length;
      let size = 0;
      for (let o = 0; o < data.length; o += BLOCK) {
        const chunk = data.subarray(o, Math.min(data.length, o + BLOCK));
        let stored = chunk;
        if (compress) {
          const z = await E.deflate(chunk);
          if (z.length < chunk.length) stored = z;
        }
        zlengths.push(stored.length === BLOCK ? 0 : stored.length);
        blobs.push(stored);
        size += stored.length;
      }
      meta.push({ zindex, length: data.length, stored: size, md5: f.name == null ? new Uint8Array(16) : E.md5(f.name) });
    }
    const tocLength = HEADER + all.length * ENTRY + zlengths.length * 2;
    const toc = new E.Writer(tocLength, false);
    let offset = tocLength;
    for (const m of meta) {
      toc.bytes(m.md5).u32(m.zindex).uintBE(m.length, 5).uintBE(offset, 5);
      offset += m.stored;
    }
    for (const z of zlengths) toc.u16(z);
    let tocBytes = toc.result();
    const encrypt = opts.encrypt !== false;
    if (encrypt) tocBytes = E.aesCfbEncrypt(tocBytes, E.KEYS.psarcKey, E.KEYS.psarcIV);
    const head = new E.Writer(HEADER, false);
    head.bytes(E.utf8("PSAR")).u16(1).u16(4).bytes(E.utf8("zlib")).u32(tocLength).u32(ENTRY).u32(all.length).u32(BLOCK).u32(encrypt ? 4 : 0);
    return E.concat([head.result(), tocBytes].concat(blobs));
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* rsc-xml.js */
/* ---------------------------------------------------------------------------
 * rsc-xml.js -- a small XML reader / writer for Rocksmith documents
 * (arrangements, vocals, showlights, game xblocks). No DOMParser: the same code
 * runs in browsers, workers and Node.
 *
 *   const doc = RSCreator.engine.xmlParse(text)  // {name, attrs, children, text}
 *   RSCreator.engine.xmlSerialize(doc, {comment})
 *   node helpers: xmlChild(node, name), xmlChildren(node, name), xmlText(node, name)
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const E = root.RSCreator.engine;

  const ENT = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'" };
  function decode(s) {
    if (s.indexOf("&") < 0) return s;
    return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e) => {
      if (e[0] === "#") return String.fromCodePoint(e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
      return ENT[e] != null ? ENT[e] : m;
    });
  }
  const escAttr = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const escText = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /** Parse XML text (or UTF-8 bytes) into {name, attrs, children, text}; comments are
   *  kept as {comment} children of the element they appear in (the root's ones too). */
  E.xmlParse = function (input) {
    let s = typeof input === "string" ? input : E.fromUtf8(input);
    if (s.charCodeAt(0) === 0xfeff) s = s.slice(1);
    const n = s.length;
    let i = 0;
    const top = { name: "#document", attrs: {}, children: [], text: "" };
    const stack = [top];
    while (i < n) {
      const lt = s.indexOf("<", i);
      const cur = stack[stack.length - 1];
      if (lt < 0) { if (stack.length > 1) cur.text += decode(s.slice(i)); break; }
      if (lt > i && stack.length > 1) {
        const t = s.slice(i, lt);
        if (cur.text || /\S/.test(t)) cur.text += decode(t);
      }
      const c = s.charCodeAt(lt + 1);
      if (c === 63 /* ? */) { const e = s.indexOf("?>", lt); i = e < 0 ? n : e + 2; continue; }
      if (c === 33 /* ! */) {
        if (s.startsWith("<!--", lt)) {
          const e = s.indexOf("-->", lt + 4);
          cur.children.push({ comment: s.slice(lt + 4, e < 0 ? n : e) });
          i = e < 0 ? n : e + 3; continue;
        }
        if (s.startsWith("<![CDATA[", lt)) {
          const e = s.indexOf("]]>", lt);
          cur.text += s.slice(lt + 9, e < 0 ? n : e);
          i = e < 0 ? n : e + 3; continue;
        }
        const e = s.indexOf(">", lt); i = e < 0 ? n : e + 1; continue;   // DOCTYPE
      }
      if (c === 47 /* / */) {
        const e = s.indexOf(">", lt);
        const name = s.slice(lt + 2, e).trim();
        if (stack.length > 1 && stack[stack.length - 1].name === name) {
          const done = stack.pop();
          if (!done.children.some((ch) => !ch.comment)) done.text = done.text.trim() === "" ? done.text.trim() : done.text;
        }
        i = e + 1; continue;
      }
      // start tag
      let j = lt + 1;
      while (j < n && !/[\s/>]/.test(s[j])) j++;
      const node = { name: s.slice(lt + 1, j), attrs: {}, children: [], text: "" };
      for (;;) {
        while (j < n && /\s/.test(s[j])) j++;
        if (s[j] === "/" || s[j] === ">") break;
        let k = j;
        while (k < n && s[k] !== "=" && !/[\s/>]/.test(s[k])) k++;
        const an = s.slice(j, k);
        while (k < n && /\s/.test(s[k])) k++;
        if (s[k] !== "=") { node.attrs[an] = ""; j = k; continue; }
        k++;
        while (k < n && /\s/.test(s[k])) k++;
        const q = s[k];
        const e = s.indexOf(q, k + 1);
        node.attrs[an] = decode(s.slice(k + 1, e));
        j = e + 1;
      }
      cur.children.push(node);
      if (s[j] === "/") { i = s.indexOf(">", j) + 1; } else { stack.push(node); i = j + 1; }
    }
    const rootEl = top.children.find((ch) => !ch.comment);
    if (!rootEl) throw new Error("Empty XML document.");
    rootEl.leading = top.children.filter((ch) => ch.comment).map((ch) => ch.comment);
    return rootEl;
  };

  E.xmlChild = (node, name) => (node ? node.children.find((c) => c.name === name) || null : null);
  E.xmlChildren = (node, name) => (node ? node.children.filter((c) => c.name === name) : []);
  E.xmlText = (node, name, dflt) => { const c = E.xmlChild(node, name); return c ? c.text : dflt; };

  /** Element builder: el("note", {time: "1.000"}, [children], "text") */
  E.el = (name, attrs, children, text) => ({ name, attrs: attrs || {}, children: children || [], text: text == null ? "" : String(text) });

  /**
   * Serialise like the Custom Song Toolkit: UTF-8 declaration, 2-space indent,
   * `<x a="1" />` for empty elements, text-only elements on one line.
   * opts.comments: comment lines placed first inside the root element.
   */
  E.xmlSerialize = function (rootEl, opts) {
    opts = opts || {};
    const out = ['<?xml version="1.0" encoding="utf-8"?>'];
    function open(node) {
      let s = "<" + node.name;

      return s;
    }
    function walk(node, ind, first) {
      if (node.comment != null) { out.push(ind + "<!--" + node.comment + "-->"); return; }
      const kids = node.children || [];
      if (!kids.length) {
        if (node.text !== "" && node.text != null) out.push(ind + open(node) + ">" + escText(node.text) + "</" + node.name + ">");
        else if (node.keepOpen) out.push(ind + open(node) + "></" + node.name + ">");
        else out.push(ind + open(node) + " />");
        return;
      }
      out.push(ind + open(node) + ">");
      if (first) for (const c of opts.comments || []) out.push(ind + "  <!--" + c + "-->");
      for (const k of kids) walk(k, ind + "  ", false);
      out.push(ind + "</" + node.name + ">");
    }
    walk(rootEl, "", true);
    return out.join("\n") + "\n";
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* rsc-sng.js */
/* ---------------------------------------------------------------------------
 * rsc-sng.js -- Rocksmith 2014 compiled charts (.sng): container, full parse,
 * serialise. (The XML -> SNG compiler is in rsc-arrangement.js.)
 *
 * Container: u32 0x4A | u32 flags (3: compressed + encrypted) | 16-byte IV |
 *            AES-CTR( u32 uncompressed length | zlib(body) ) | 56-byte signature
 * Body: length-prefixed (u32 count) arrays of packed little-endian structs, in
 * the order of SECTIONS below. parse() reads every field and serialize() writes
 * them back byte for byte (tested on every .sng of the sample songs).
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const E = root.RSCreator.engine;

  /** Key for a platform: "pc" (Windows, songs/bin/generic) or "mac" (songs/bin/macos). */
  E.sngKey = (platform) => (platform === "mac" ? E.KEYS.sngMac : E.KEYS.sngPC);

  /** Decrypt + inflate. platform "auto" tries PC then Mac. -> {body, platform, iv} */
  E.sngDecrypt = async function (u8, platform) {
    const r = new E.Reader(u8);
    if (u8.length < 28 || r.u32() !== 0x4a) throw new Error("Not a Rocksmith SNG file.");
    const iv = u8.slice(8, 24), payload = u8.subarray(24);
    const tries = platform === "mac" ? ["mac"] : platform === "pc" ? ["pc"] : ["pc", "mac"];
    for (const p of tries) {
      const plain = E.aesCtr(payload, E.sngKey(p), iv);
      if (plain.length > 6 && plain[4] === 0x78) {
        const len = new DataView(plain.buffer).getUint32(0, true);
        // the zlib stream is followed by the 56-byte signature (decrypted: junk), which strict
        // inflaters (the browser's DecompressionStream) refuse: cut it, else try the whole rest
        for (const end of [plain.length - 56, plain.length]) {
          try {
            const body = await E.inflate(plain.subarray(4, end));
            if (body.length === len) return { body, platform: p, iv };
          } catch (err) { /* next variant / key */ }
        }
        // more bytes after the stream (some toolkits pad the file): keep what inflates before them
        try {
          const body = await E.inflateLenient(plain.subarray(4));
          if (body.length >= len) return { body: body.length === len ? body : body.slice(0, len), platform: p, iv };
        } catch (err) { /* next key */ }
      }

  };

  E.sngEncrypt = async function (body, platform, opts) {
    opts = opts || {};
    const z = await E.deflate(body);
    const plain = new Uint8Array(4 + z.length);
    new DataView(plain.buffer).setUint32(0, body.length, true);
    plain.set(z, 4);

  // ---- struct codecs: [name, type] with types u8 i8 u16 i16 u32 i32 f32 f64, "u8[n]", "cstr:n", ...
  const T = {
    bpm: [["time", "f32"], ["measure", "i16"], ["beat", "i16"], ["phraseIteration", "i32"], ["mask", "i32"]],
    phrase: [["solo", "u8"], ["disparity", "u8"], ["ignore", "u8"], ["padding", "u8"], ["maxDifficulty", "i32"],

    chord: [["mask", "u32"], ["frets", "u8[6]"], ["fingers", "u8[6]"], ["notes", "i32[6]"], ["name", "cstr:32"]],
    bend32: [["time", "f32"], ["step", "f32"], ["unk3", "i16"], ["unk4", "u8"], ["unk5", "u8"]],
    vocal: [["time", "f32"], ["note", "i32"], ["length", "f32"], ["lyric", "cstr:48"]],
    symHeader: [["unk", "i32[8]"]],
    symTexture: [["font", "cstr:128"], ["fontpathLength", "i32"], ["unk1", "i32"], ["width", "i32"], ["height", "i32"]],
    symDef: [["text", "cstr:12"], ["outer", "f32[4]"], ["inner", "f32[4]"]],
    phraseIteration: [["phraseId", "i32"], ["startTime", "f32"], ["nextPhraseTime", "f32"], ["difficulty", "i32[3]"]],
    phraseExtra: [["phraseId", "i32"], ["difficulty", "i32"], ["empty", "i32"], ["levelJump", "u8"], ["redundant", "i16"], ["padding", "u8"]],
    action: [["time", "f32"], ["name", "cstr:256"]],
    event: [["time", "f32"], ["name", "cstr:256"]],
    tone: [["time", "f32"], ["toneId", "i32"]],
    dna: [["time", "f32"], ["dnaId", "i32"]],
    section: [["name", "cstr:32"], ["number", "i32"], ["startTime", "f32"], ["endTime", "f32"], ["startPhraseIterationId", "i32"],

    anchor: [["startBeatTime", "f32"], ["endBeatTime", "f32"], ["firstNoteTime", "f32"], ["lastNoteTime", "f32"], ["fretId", "u8"],
      ["padding", "u8[3]"], ["width", "i32"], ["phraseIterationId", "i32"]],
    anchorExt: [["beatTime", "f32"], ["fretId", "u8"], ["unk2", "i32"], ["unk3", "i16"], ["unk4", "u8"]],
    fingerprint: [["chordId", "i32"], ["startTime", "f32"], ["endTime", "f32"], ["firstNoteTime", "f32"], ["lastNoteTime", "f32"]],
    note: [["mask", "u32"], ["flags", "u32"], ["hash", "u32"], ["time", "f32"], ["string", "u8"], ["fret", "u8"], ["anchorFret", "u8"],
      ["anchorWidth", "u8"], ["chordId", "i32"], ["chordNotesId", "i32"], ["phraseId", "i32"], ["phraseIterationId", "i32"],
      ["fingerPrintId", "i16[2]"], ["nextIterNote", "i16"], ["prevIterNote", "i16"], ["parentPrevNote", "i16"], ["slideTo", "u8"],
      ["slideUnpitchTo", "u8"], ["leftHand", "u8"], ["tap", "u8"], ["pickDirection", "u8"], ["slap", "u8"], ["pluck", "u8"],

  const writeArray = (w, a, fn) => { w.u32(a.length); for (const x of a) fn(x); };

  function readChordNotes(r) {
    const o = { noteMask: readField(r, "u32[6]"), bendData: [] };
    for (let s = 0; s < 6; s++) {

 * ------------------------------------------------------------------------- */

    else if (project.meta.metaEdited || project.arrangements.some((a) => a.edited) || attrsAll.length !== Object.keys(JSON.parse(E.fromUtf8(await source.read(hsanName))).Entries).length) {
      const text = E.fromUtf8(await source.read(hsanName)), j = JSON.parse(text);
      const byId = Object.fromEntries(attrsAll.map((a) => [a.PersistentID, a]));
      const j2 = JSON.parse(E.hsanPatch(text, byId));
      for (const id of Object.keys(j2.Entries)) if (!byId[id]) delete j2.Entries[id];          // removed arrangements
      const missing = attrsAll.filter((a) => !j.Entries[a.PersistentID]);
      if (missing.length) Object.assign(j2.Entries, JSON.parse(E.hsanJson(missing)).Entries);  // added ones
      put(hsanName, JSON.stringify(j2, null, 2));
    }
    // package files of a new song (or files a song lacks)
    const has = (n) => out.has(n) || source.has(n);
    const arrsForX = project.arrangements.map((a) => ({ id: a.id, name: a.name, persistentId: a.persistentId }))
      .concat(project.vocals && project.vocals.syllables.length ? [{ id: project.vocals.id, name: "Vocals", persistentId: project.vocals.persistentId }] : []);
    const xblockName = (source.arc && source.arc.names().find((n) => /\.xblock$/.test(n))) || P.xblock;
    const origIds = (project.files || []).filter((n) => /^manifests\/.*\.json$/.test(n)).map((n) => n.replace(/^.*\//, "").replace(/\.json$/, "")).sort();
    const nowIds = arrsForX.map((a) => a.id).sort();
    if (!has(xblockName) || fresh || JSON.stringify(origIds) !== JSON.stringify(nowIds)) put(xblockName, E.xblockXml(songMeta, arrsForX));
    if (!has(P.showlights)) put(P.showlights, E.showlightsXml(project.arrangements[0] ? project.arrangements[0].doc : { sections: project.sections, songLength: project.meta.songLength }));
    if (!has(P.flatRoot)) put(P.flatRoot, E.fromBase64(E.FLAT_ROOT));
    if (!has(P.flatSong)) put(P.flatSong, E.fromBase64(E.FLAT_SONG));
    if (!has("appid.appid")) put("appid.appid", E.APP_ID);
    if (!has("toolkit.version") || fresh) put("toolkit.version", E.toolkitVersionText(project.meta.author, project.meta.version));

    // everything else: the original archive's files (unless replaced / removed), then the new ones
    const removed = new Set(project.removed || []);
    const names = [];
    for (const n of source.arc ? source.arc.names() : []) {
      if (removed.has(n)) continue;
      if (opts.platformChanged && /^(audio\/|songs\/bin\/)/.test(n)) continue;   // re-added under the new platform's paths
      names.push(n);
    }
    for (const n of source.added.keys()) if (!names.includes(n)) names.push(n);
    for (const n of out.keys()) if (!names.includes(n)) names.push(n);
    const files = [];
    for (const n of names) {
      if (out.has(n)) files.push({ name: n, data: out.get(n) });
      else files.push({ name: n, data: await source.read(n) });
    }
    if (opts.platformChanged && source.arc) {
      const oldP = E.PLATFORMS[opts.fromPlatform], newP = E.PLATFORMS[plat];
      for (const n of source.arc.names()) {
        if (n.startsWith(oldP.audio + "/")) files.push({ name: newP.audio + n.slice(oldP.audio.length), data: await source.read(n) });
      }
      for (const n of source.arc.names()) {
        if (!n.startsWith(oldP.sng + "/")) continue;
        const nn = newP.sng + n.slice(oldP.sng.length);
        if (files.some((f) => f.name === nn)) continue;
        const body = (await E.sngDecrypt(await source.read(n), opts.fromPlatform)).body;
        files.push({ name: nn, data: await E.sngEncrypt(body, plat) });
      }
    }
    // the aggregate graph names every asset: rebuilt when files were added or moved
    const graphName = files.find((f) => /_aggregategraph\.nt$/.test(f.name));
    const originalSet = new Set(source.arc ? source.arc.names() : []);
    const changedSet = files.some((f) => !originalSet.has(f.name)) || (source.arc && source.arc.names().some((n) => !files.some((f) => f.name === n)));
    const graph = E.aggregateGraph(songMeta, files.map((f) => f.name), plat);
    if (!graphName) files.unshift({ name: P.graph, data: E.utf8(graph) });
    else if (changedSet || fresh) graphName.data = E.utf8(graph);
    // root files first, like the toolkit
    const rank = (n) => (n === "appid.appid" ? 0 : /_aggregategraph\.nt$/.test(n) ? 1 : n === "toolkit.version" ? 2 : 3);
    files.sort((a, b) => rank(a.name) - rank(b.name) || (fresh ? a.name.localeCompare(b.name) : 0));
    return files;
  };

  /** Save: -> .psarc bytes. opts.platform converts PC <-> Mac. */
  E.projectSave = async function (project, source, opts) {
    opts = opts || {};
    let plat = project.platform, o = {};
    if (opts.platform && opts.platform !== project.platform) { o = { platformChanged: true, fromPlatform: project.platform }; project.platform = opts.platform; }
    try {
      const files = await E.projectFiles(project, source, o);
      return await E.psarcWrite(files);
    } finally { project.platform = plat; }
  };

  /** File name of a saved package: Artist_Title_v1_p.psarc / _m.psarc */
  E.packageFileName = function (project, platform) {
    const clean = (s) => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const v = String(project.meta.version || "1").replace(/[^0-9A-Za-z.]/g, "");
    return (clean(project.meta.artist) || "Artist") + "_" + (clean(project.meta.title) || "Song") + "_v" + v + E.PLATFORMS[platform || project.platform].suffix + ".psarc";
  };

  // ---- new songs ---------------------------------------------------------------------------------------------
  /**
   * A new song from scratch.
   * opts: {title, artist, album, year, platform, audio: {channels: [Float32Array], sampleRate} | {wem: bytes},
   *        bpm, offset (first beat, s), beatsPerBar, arrangements: [{kind, tuning}], art: {rgba, width, height}}
   * -> {project, source}
   */
  E.projectNew = async function (opts) {
    const platform = opts.platform || "pc", key = opts.key || E.songKey(opts.artist, opts.title);
    const source = E.makeSource(null);
    const P0 = E.PLATFORMS[platform];
    let wem, codec, duration, sampleRate, channels = 2;
    if (opts.audio && opts.audio.wem) {
      wem = opts.audio.wem; const info = E.wemInfo(wem); codec = info.codec; duration = info.duration; sampleRate = info.sampleRate; channels = info.channels;
    } else if (opts.audio && opts.audio.channels) {
      sampleRate = opts.audio.sampleRate; channels = opts.audio.channels.length; duration = opts.audio.channels[0].length / sampleRate;
      wem = E.pcmToWem(opts.audio.channels, sampleRate); codec = "pcm";
    } else throw new Error("A new song needs its audio.");
    const length = Math.round(duration * 1000) / 1000;
    const project = {
      format: E.PROJECT_FORMAT, key, platform, files: [],
      meta: { title: opts.title || "Untitled", titleSort: opts.title || "Untitled", artist: opts.artist || "Unknown Artist", artistSort: opts.artist || "Unknown Artist",
        album: opts.album || "", albumSort: opts.album || "", year: opts.year ? String(opts.year) : String(new Date().getFullYear()),
        averageTempo: opts.bpm || 120, songLength: length, volume: -7, previewVolume: -7, author: opts.author || "", version: "1", metaEdited: false },
      beats: opts.beats || E.beatsFromTempo(opts.bpm || 120, opts.offset || 0, length, opts.beatsPerBar || 4),
      sections: opts.sections || [{ name: "intro", number: 1, startTime: Math.round((opts.offset || 0) * 1000) / 1000 }],
      arrangements: [], vocals: null, beatsEdited: false, sectionsEdited: false
    };
    project.meta.averageTempo = E.averageTempo(project.beats);
    const lower = key.toLowerCase(), used = {};
    for (const spec of opts.arrangements || [{ kind: "lead" }]) {
      const K = E.ARRANGEMENT_KINDS[spec.kind];
      used[spec.kind] = (used[spec.kind] || 0) + 1;
      const id = lower + "_" + spec.kind + (used[spec.kind] > 1 ? used[spec.kind] : "");
      project.arrangements.push({ id, name: K.label + (used[spec.kind] > 1 ? " " + used[spec.kind] : ""), kind: spec.kind, represent: used[spec.kind] === 1,
        bonus: used[spec.kind] > 1, levels: 1, doc: E.newArrangementDoc(project, spec.kind, spec.tuning), dd: null, origin: null, persistentId: null, tones: null, edited: true });
    }
    // audio: the song and a 30 s preview (from the middle of the song for PCM), with their banks
    const wemId = E.fnv1_32("rsc-wem:" + key) & 0x7fffffff, prevId = E.fnv1_32("rsc-wem-preview:" + key) & 0x7fffffff;
    let prevWem = wem;
    if (codec === "pcm") {
      const ch = opts.audio.channels || E.wemPcmChannels(wem);
      const sr = sampleRate, start = Math.floor(Math.max(0, (opts.previewStart != null ? opts.previewStart : duration * 0.35)) * sr);
      const end = Math.min(ch[0].length, start + 30 * sr);
      const fade = Math.floor(sr * 1.5);
      const clip = ch.map((c) => { const x = c.slice(start, end); for (let i = 0; i < fade && i < x.length; i++) { x[i] *= i / fade; x[x.length - 1 - i] *= i / fade; } return x; });
      prevWem = E.pcmToWem(clip, sr);
    }
    const songBank = E.bankBuild({ name: key, wemId, wem, codec, volume: -7 });
    const prevBank = E.bankBuild({ name: key + "_Preview", wemId: prevId, wem: prevWem, codec, preview: true, volume: -7 });
    const P = E.pathsFor(project);
    source.put(P.wem(wemId), wem); source.put(P.wem(prevId), prevWem);
    source.put(P.bank, songBank.bytes); source.put(P.previewBank, prevBank.bytes);
    project.audio = { song: P.wem(wemId), preview: P.wem(prevId), songBank: P.bank, previewBank: P.previewBank, replaced: true, dir: P0.audio,
      codec, sampleRate, channels, duration: length };
    if (opts.art && opts.art.rgba) {
      const set = E.albumArtSet(opts.art.rgba, opts.art.width, opts.art.height);
      for (const n of [256, 128, 64]) source.put(P.art(n), set[n]);
      project.art = { names: [256, 128, 64].map((n) => P.art(n)), replaced: true };
    } else project.art = { names: [], replaced: false };
    return { project, source };
  };

  /** Replace the album art of a project (any RGBA image). */
  E.projectSetArt = function (project, source, rgba, w, h) {
    const P = E.pathsFor(project), set = E.albumArtSet(rgba, w, h);
    for (const old of project.art.names || []) (project.removed = project.removed || []).push(old);
    const names = [256, 128, 64].map((n) => P.art(n));
    for (const n of [256, 128, 64]) source.put(P.art(n), set[n]);
    project.removed = (project.removed || []).filter((n) => !names.includes(n));
    project.art = { names, replaced: true };
  };

  /** Add an arrangement (kind, tuning) to a project. */
  E.projectAddArrangement = function (project, kind, tuning) {
    const K = E.ARRANGEMENT_KINDS[kind], lower = lowerKey(project);
    let n = 1, id = lower + "_" + kind;
    while (project.arrangements.some((a) => a.id === id)) { n++; id = lower + "_" + kind + n; }
    const a = { id, name: K.label + (n > 1 ? " " + n : ""), kind, represent: !project.arrangements.some((x) => x.kind === kind), bonus: n > 1,
      levels: 1, doc: E.newArrangementDoc(project, kind, tuning), dd: null, origin: null, persistentId: null, tones: null, edited: true };
    project.arrangements.push(a);
    return a;
  };

  /** Remove an arrangement (its files are dropped from the package). */
  E.projectRemoveArrangement = function (project, id) {
    const i = project.arrangements.findIndex((a) => a.id === id);
    if (i < 0) return;
    const a = project.arrangements[i];
    project.removed = project.removed || [];
    if (a.origin) for (const n of [a.origin.xml, a.origin.sng, a.origin.manifest]) if (n) project.removed.push(n);
    project.arrangements.splice(i, 1);
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* rsc-difficulty.js */
/* ---------------------------------------------------------------------------
 * rsc-difficulty.js -- Dynamic Difficulty (DD): the difficulty levels of a chart.
 *
 * Rocksmith stores a chart once per difficulty level (<level difficulty="k">).
 * Every phrase has a max difficulty m; a player at level k plays, in each phrase
 * iteration, the content of level min(k, m). The hardest chart is every phrase
 * at its own m.
 *
 * In the Creator an arrangement `a` keeps:
 *   a.doc            the arrangement document the editor works on; a.doc.levels[0]
 *                    is the *view*: the chart at one difficulty (see below)
 *   a.dd             null (one level: no difficulty levels), or
 *                    { levels: [level 0 .. level M] (the stored difficulty levels),
 *                      view:   null (the hardest chart) | k (the chart at level k),
 *                      mode:   "keep" (save the levels as they are) |
 *                              "auto" (rebuild the easier levels from the hardest when saving) |
 *                              "flat" (save the hardest chart as one level),
 *                      auto:   options of the generator, dirty: {level: true} }
 *   a.doc.phrases[p].maxDifficulty, phraseIterations[i].heroLevels, newLinkedDiffs: as in the file.
 *
 * The view is cut out of the stored levels phrase iteration by phrase iteration
 * (E.ddExtract) and written back the same way (E.ddCommit), so an edit made while
 * looking at level 3 lands in level 3 of the phrases that have it (and in their
 * top level where m < 3).
 *
 * E.ddGenerate builds the levels of a chart from its hardest version -- the
 * "auto difficulty" -- with rules measured on hand-made DD in the sample songs:
 * easier levels keep a subset of the events (the metrically strongest first:
 * downbeats, beats, eighths...), ~12 % of them at level 0 rising linearly to all;
 * chords lose their upper strings (one note at the easiest levels); techniques,
 * frets and sustains of the notes that stay are kept; phrases with more events
 * get more levels (0 for one or two events); hero levels follow the toolkit's
 * rule (easy 1 or 2, hard = m, medium between).
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const E = root.RSCreator.engine;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const emptyLevel = (d) => ({ difficulty: d, notes: [], chords: [], fretHandMutes: [], anchors: [], handShapes: [] });
  E.ddEmptyLevel = emptyLevel;
  const KINDS = ["notes", "chords", "anchors", "handShapes", "fretHandMutes"];
  const tOf = (kind, x) => (kind === "handShapes" ? x.startTime : x.time);
  const byTime = (kind) => (p, q) => tOf(kind, p) - tOf(kind, q) || (kind === "notes" ? p.string - q.string : 0);

  // ---- phrase iterations as time ranges ---------------------------------------------------------------------
  /**
   * The phrase iterations of a document as time ranges, in time order:
   * [{i (index in phraseIterations), phraseId, start, t0, t1}]. The first range
   * starts at -Infinity (anything before the first phrase belongs to it), the
   * last ends at +Infinity.
   */
  E.ddRanges = function (doc) {
    const its = (doc.phraseIterations || []).map((it, i) => ({ i, phraseId: it.phraseId, start: it.time })).sort((a, b) => a.start - b.start || a.i - b.i);
    if (!its.length) return [{ i: -1, phraseId: -1, start: 0, t0: -Infinity, t1: Infinity }];
    return its.map((it, j) => Object.assign(it, { t0: j === 0 ? -Infinity : it.start, t1: j + 1 < its.length ? its[j + 1].start : Infinity }));
  };
  /** Max difficulty of a phrase, clamped to the levels there are (0 .. top). */
  function maxOf(doc, phraseId, top) {
    const p = doc.phrases && doc.phrases[phraseId];
    return Math.max(0, Math.min(top, p ? p.maxDifficulty | 0 : top));
  }
  /** The level a player at level k plays in a phrase with max difficulty m (k null: the hardest). */
  const effective = (k, m) => (k == null ? m : Math.min(k, m));
  const inRange = (r) => (t) => t >= r.t0 && t < r.t1;
  function slice(level, r) {
    const f = inRange(r), out = {};
    for (const k of KINDS) out[k] = (level[k] || []).filter((x) => f(tOf(k, x)));
    return out;
  }
  /** The anchor in force at time t in a level (the last one at or before t). */
  function anchorAt(level, t) {
    let a = null;
    for (const x of level.anchors) { if (x.time <= t + 1e-6) a = x; else break; }
    return a;
  }

  // ---- the view: the chart at one difficulty -----------------------------------------------------------------------
  /**
   * The chart a player at level k plays (k null: the hardest chart), as one level
   * (difficulty 0). Every phrase iteration starts with the anchor its level has
   * in force there (tagged _carry, dropped again when the view is written back).
   */
  E.ddExtract = function (levels, doc, k) {
    const top = levels.length - 1, out = emptyLevel(0);
    const byDiff = levels.slice().sort((a, b) => a.difficulty - b.difficulty);
    for (const r of E.ddRanges(doc)) {
      const lv = byDiff[effective(k, r.phraseId < 0 ? top : maxOf(doc, r.phraseId, top))];
      if (!lv) continue;
      const s = slice(lv, r);
      for (const kind of KINDS) for (const x of s[kind]) out[kind].push(clone(x));
      // the iteration's anchor
      if (r.i >= 0 && (s.notes.length || s.chords.length) && !s.anchors.some((a) => Math.abs(a.time - r.start) < 1e-3)) {
        const act = anchorAt(lv, r.start);
        if (act) out.anchors.push({ time: r.start, fret: act.fret, width: act.width, _carry: 1 });
      }
    }
    for (const kind of KINDS) out[kind].sort(byTime(kind));
    return out;
  };

  /** Sorted levels 0..M (missing ones empty) from a document's levels. */
  E.ddNormalizeLevels = function (levels) {
    const M = Math.max(0, ...levels.map((l) => l.difficulty | 0));
    const out = [];
    for (let d = 0; d <= M; d++) {
      const l = levels.find((x) => (x.difficulty | 0) === d);
      out.push(l ? Object.assign(emptyLevel(d), l, { difficulty: d }) : emptyLevel(d));
    }
    return out;
  };

  /**
   * Set up an arrangement from a full (multi-level) document: a.dd holds its
   * levels, a.doc the hardest chart as the view. One level: a.dd = null.
   */
  E.ddInit = function (a, doc) {
    const ds = (doc.levels || []).map((l) => l.difficulty | 0).sort((p, q) => p - q);
    if (ds.length <= 1 || ds.some((v, i) => v !== i)) { a.dd = null; a.doc = E.arrMergeLevels(doc); a.levels = Math.max(1, ds.length); return a; }
    const levels = E.ddNormalizeLevels(doc.levels);
    const d = clone(Object.assign({}, doc, { levels: [] }));
    d.levels = [E.ddExtract(levels, d, null)];
    a.doc = d;
    a.dd = { levels, view: null, mode: "keep", auto: {}, dirty: {} };
    a.levels = levels.length;
    return a;
  };

  /**
   * Write the view back into the stored levels (phrase iteration by phrase
   * iteration, into the level each one shows). -> true when something changed.
   */
  E.ddCommit = function (a) {
    if (!a.dd) return false;
    const doc = a.doc, view = doc.levels[0], levels = a.dd.levels, top = levels.length - 1;
    let changed = false;
    for (const r of E.ddRanges(doc)) {
      const e = effective(a.dd.view, r.phraseId < 0 ? top : maxOf(doc, r.phraseId, top));
      const lv = levels[e];
      if (!lv) continue;
      const nv = slice(view, r);
      // an anchor carried in by the view is dropped unless it was changed
      nv.anchors = nv.anchors.filter((x) => {
        if (!x._carry) return true;
        const act = anchorAt({ anchors: lv.anchors.filter((y) => y.time < x.time - 1e-6) }, x.time);
        return !(act && act.fret === x.fret && act.width === x.width);
      }).map((x) => { const y = clone(x); delete y._carry; return y; });
      const old = slice(lv, r);
      let same = true;
      for (const k of KINDS) if (canon(old[k]) !== canon(nv[k])) { same = false; break; }
      if (same) continue;
      const f = inRange(r);
      for (const k of KINDS) {
        lv[k] = (lv[k] || []).filter((x) => !f(tOf(k, x))).concat(clone(nv[k]));
        lv[k].sort(byTime(k));
      }
      a.dd.dirty = a.dd.dirty || {};
      a.dd.dirty[e] = true;
      changed = true;
    }
    return changed;
  };

  /** Order-independent text of a list of items (notes at one time come in any string order). */
  function canon(list) { return list.map((x) => JSON.stringify(x)).sort().join("\n"); }

  /** Show the chart at level k (null: the hardest) in the view. */
  E.ddShow = function (a, k) {
    if (!a.dd) return;
    E.ddCommit(a);
    const top = a.dd.levels.length - 1;
    a.dd.view = k == null ? null : Math.max(0, Math.min(top, k | 0));
    a.doc.levels[0] = E.ddExtract(a.dd.levels, a.doc, a.dd.view);
  };

  /** Re-cut the view from the stored levels (after they changed). */
  function refreshView(a) {
    if (!a.dd) return;
    const top = a.dd.levels.length - 1;
    if (a.dd.view != null && a.dd.view > top) a.dd.view = top;
    a.doc.levels[0] = E.ddExtract(a.dd.levels, a.doc, a.dd.view);
    a.levels = a.dd.levels.length;
  }

  // ---- hero levels (the game's easy / medium / hard per phrase) ---------------------------------------------------
  /** The toolkit's hero levels for a phrase of max difficulty m: easy 1 or 2, hard m, medium between. */
  E.ddHeroLevels = function (m) {
    if (!(m > 0)) return [];
    const easy = m <= 3 ? 1 : 2, hard = m, medium = Math.floor((easy + hard) / 2 + 0.5);
    return [{ difficulty: easy, hero: 1 }, { difficulty: medium, hero: 2 }, { difficulty: hard, hero: 3 }];
  };
  /** Hero levels of every iteration that has none or inconsistent ones (all, with force). */
  E.ddFixHeroLevels = function (doc, force) {
    for (const it of doc.phraseIterations || []) {
      const m = (doc.phrases[it.phraseId] || {}).maxDifficulty | 0;
      const h = it.heroLevels || [];
      const ok = m === 0 ? h.every((x) => x.difficulty === 0) :
        h.length === 3 && h.every((x) => x.difficulty >= 0 && x.difficulty <= m) && (h.find((x) => x.hero === 3) || {}).difficulty === m;
      if (force || !ok) it.heroLevels = E.ddHeroLevels(m);
    }
    return doc;
  };

  // ---- the document to save ------------------------------------------------------------------------------------------
  /** Remove what lies above each phrase's max difficulty, drop unused top levels. */
  function tidy(doc) {
    let levels = doc.levels;
    const top = levels.length - 1;
    for (const p of doc.phrases) p.maxDifficulty = Math.max(0, Math.min(top, p.maxDifficulty | 0));
    for (const r of E.ddRanges(doc)) {
      const m = r.phraseId < 0 ? top : maxOf(doc, r.phraseId, top), f = inRange(r);
      for (let d = m + 1; d <= top; d++) for (const k of KINDS) levels[d][k] = levels[d][k].filter((x) => !f(tOf(k, x)));
    }
    const used = Math.max(0, ...E.ddRanges(doc).map((r) => (r.phraseId < 0 ? 0 : maxOf(doc, r.phraseId, top))));
    doc.levels = levels.slice(0, used + 1);
    for (const l of doc.levels) for (const x of l.anchors) delete x._carry;
    return doc;
  }

  /**
   * The arrangement document to save (compile + serialise): the stored levels
   * ("keep"), levels rebuilt from the hardest chart ("auto"), or the hardest chart

/* ---------------------------------------------------------------------------
 * rsc-beats.js -- a beat grid from the audio (songs made from scratch, or

 * dynamic-programming beat tracker (Ellis 2007: each beat as strong as
 * possible, spacing close to the period) -> bar phase from the low-frequency

/* ---------------------------------------------------------------------------
 * rsc-sync.js -- lyrics re-timed to the recording.
 *
 * Auto-sync (one shift for the whole lyrics, which LRC lyrics timed on *a*

 * where the recording's centre channel sings -- robust, never seconds off -- then

 * +-0.8 s. Measured on the sample songs with studio-timed lyrics shifted by up to
 * +-2.5 s: median line error 0.30 s, worst 0.72 s (RockShiny's aligner alone:
 * 9 of 39 trials more than 1 s off). Per-line acoustic snapping was measured and
 * left out: no vocal-onset feature of the mixes told a line start from the

 * placed lines (lyrics of another take), tap-along timing, moving a line's syllables.
 *

 *   RSCreator.sync.activityLag(syl, presence, max) the shift that fits the lyrics' phrases
 *   RSCreator.sync.fitDrift(pairs)                 -> {a, b}: t' = a * t + b
 *   RSCreator.sync.applyDrift(starts, fit)         -> new line starts

<script>/* karaoke-sync.js (RockShiny) */
/* ---------------------------------------------------------------------------
 * karaoke-sync.js -- lyrics that are not in the .psarc: LRC files (a sidecar

 *   RSKaraoke.syllabify(word)         -> ["e", "ve", "ry", "thing"]
 *   RSKaraoke.timeLine(words, t, next) -> syllable times of a line timed only by its start
 *   RSKaraoke.alignLRC(buf, lines, o) -> {offset, confidence, moved} (seconds)

 *

 *

 * line-timed ones by a timing model fitted to the sample songs' studio-timed

        timed.push({ t, text: txt, words: rel ? rel.map((W) => ({ w: W.w, t: W.dt == null ? null : t + W.dt })) : null });
      }
    }
    timed.sort((a, b) => a.t - b.t);
    const shift = out.offsetMs / 1000;                         // [offset:+ms] shows the lyrics sooner
    for (const L of timed) { L.t -= shift; if (L.words) for (const W of L.words) if (W.t != null) W.t -= shift; }
