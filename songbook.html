  <script>
/* ---------------------------------------------------------------------------
 * clock.js -- playback clock for the note highway.
 *
 * The <audio> element is the MASTER. The chart is never "played" on its own
 * timer, which is what causes drift in naive implementations.
 *
 * Problem: HTMLMediaElement.currentTime is updated at a coarse, browser-
 * specific cadence (and is stale by the time you read it), so drawing with it
 * directly makes notes judder at 60 fps.
 * Solution: keep an anchor (mediaTime, perfTime) and extrapolate with the
 * frame timestamp. Whenever the element reports a new currentTime we measure
 * the error and slew towards it (small errors) or snap (seek/stall).
 *
 * Without audio (not converted yet / no decoder) the clock free-runs, so
 * the chart is still usable silently. Audio attached later takes over at the
 * current position.
 * ------------------------------------------------------------------------- */
(function (root) {
  "use strict";
  const NS = (root.RSHighway = root.RSHighway || {});

  const SNAP_THRESHOLD = 0.05;  // s: larger errors -> hard resync (seek, stall, GC pause)
  // Error correction is time-based (not per report) so it converges equally
  // fast at 60 fps and on a slow machine rendering 20 fps. 0.33 s matches the
  // previously tuned 5 %-per-frame at 60 fps.
  const SLEW_TAU = 0.33;        // s

  class SongClock {
    constructor() {
      this.audio = null;
      this.duration = 0;
      this.rate = 1;
      this.playing = false;       // transport intent
      this._running = false;      // clock actually advancing
      this._anchorMedia = 0;
      this._anchorPerf = 0;
      this._lastReported = NaN;
      this._listeners = null;
      this.onEnded = null;
      this.onStateChange = null;
      this.partialAudio = false;    // true while the attached audio is a quick-start clip
    }

    /** Current media time (s) at performance timestamp `nowMs`. */
    time(nowMs) {
      let t = this._anchorMedia;
      if (this._running && !this._waiting) t += ((nowMs - this._anchorPerf) / 1000) * this.rate;
      if (t < 0) return 0;
      return this.duration > 0 && t > this.duration ? this.duration : t;
    }

    /** Call once per animation frame with the rAF timestamp. */
    tick(nowMs) {
      const a = this.audio;
      if (a && this._running && !a.paused) {
        const reported = a.currentTime;
        if (reported !== this._lastReported) {
          this._lastReported = reported;
          if (this._waiting) {                       // paused for the audio to catch up
            if (reported >= this._anchorMedia - 0.002) this._anchor(reported, nowMs);
            return;
          }
          const err = reported - this.time(nowMs);
          const since = this._lastReportPerf ? (nowMs - this._lastReportPerf) / 1000 : 1 / 60;
          this._lastReportPerf = nowMs;
          if (err < -SNAP_THRESHOLD && err > -0.5) {
            // audio fell behind (start-up, stall): wait for it -- never step back while playing
            this._anchor(this.time(nowMs), nowMs);
            this._waiting = true;
          } else if (Math.abs(err) > SNAP_THRESHOLD) this._anchor(reported, nowMs);
          else this._anchorMedia += err * (1 - Math.exp(-Math.min(since, 0.25) / SLEW_TAU));
        }
      } else if (!a && this._running && this.duration > 0 && this.time(nowMs) >= this.duration) {
        this._stopAt(this.duration);
        if (this.onEnded) this.onEnded();
      }
    }

    play() {
      if (this.playing) return;
      this.playing = true;
      if (this.audio) {
        const p = this.audio.play();        // 'playing' event anchors the clock
        if (p && p.catch) p.catch((e) => { if (this._holding || e.name === "AbortError") return; this.playing = false; this._emit(e); });
      } else {
        if (this.duration > 0 && this._anchorMedia >= this.duration) this._anchorMedia = 0;
        this._anchor(this._anchorMedia, performance.now());
        this._running = true;
      }
      this._emit();

    pause() {
      if (!this.playing) return;
      const now = performance.now();
      this.playing = false;
      this._holding = false;
      if (this.audio) {
        this.audio.pause();
        this._stopAt(this.audio.currentTime);
      } else {
        this._stopAt(this.time(now));
      }
      this._emit();
    }

    toggle() { this.playing ? this.pause() : this.play(); }

    seek(t) {
      t = Math.max(0, this.duration > 0 ? Math.min(t, this.duration) : t);
      this._anchor(t, performance.now());
      if (this.audio) this.audio.currentTime = t;   // 'seeked' re-anchors precisely
      if (this._holding) {                           // leaving a hold: resume if playing
        this._holding = false;
        if (this.playing) {
          if (this.audio) { const p = this.audio.play(); if (p && p.catch) p.catch(() => {}); }
          else this._running = true;
        }

    /**
     * Freeze at `t` (default: now) but keep the intent to play: used while the
     * rest of the audio is still loading (quick-start clip ran out, or a seek
     * beyond it). Attaching the next audio element resumes playback.

      if (t == null) t = this.time(now);

    get holding() { return !!this._holding; }

    /** Start "playing" in the held state (e.g. play pressed beyond a quick-start clip). */
    playHeld(t) {
      this.playing = true;
      this.hold(t);
    }

    /**
     * Make `audio` (already playing, aligned with the current one) the master
     * without seeking it. Returns the previous element, still playing: the
     * caller fades it out and releases it.
     */

      const old = this.audio;
      if (old && this._listeners) for (const k in this._listeners) old.removeEventListener(k, this._listeners[k]);
      this.audio = null; this._listeners = null;
      this._bind(audio);
      this.audio = audio;
      // no re-anchor: the new element is already aligned with the old one, so the
      // clock keeps its own continuous timeline and the normal slew absorbs the
      // few ms of difference (a hard anchor here showed up as a visible jump)
      this._lastReported = NaN;
      this._lastReportPerf = 0;
      this._running = !audio.paused;
      return old;
    }

    setRate(r) {
      const now = performance.now();
      this._anchor(this.time(now), now);
      this.rate = r;
      if (this.audio) {
        this.audio.playbackRate = r;
        this.audio.preservesPitch = true;
      }
    }

    /** Hand the clock over to an <audio> element, keeping the position. */
    attach(audio) {
      this.detach();
      const now = performance.now();
      const pos = this.time(now);
      this._holding = false;
      this._bind(audio);
      this.audio = audio;
      audio.playbackRate = this.rate;
      audio.preservesPitch = true;
      audio.currentTime = pos;
      if (this.playing) {
        // keep free-running until the element actually starts ('playing')
        const p = audio.play();
        if (p && p.catch) p.catch((e) => { if (this._holding || e.name === "AbortError") return; this.playing = false; this._stopAt(pos); this._emit(e); });
      }
    }

    _bind(audio) {
      const on = {
        playing: () => {
          if (this._holding) { this._ignorePause = true; audio.pause(); return; }   // a late 'playing' must not end a hold
          this._anchor(audio.currentTime, performance.now()); this._running = true;
        },
        play: () => { if (!this.playing) { this.playing = true; this._emit(); } },
        pause: () => {                                             // also OS media keys
          if (this._ignorePause) { this._ignorePause = false; return; }   // our own hold()
          if (this._holding) return;
          this._stopAt(audio.currentTime);
          if (this.playing && !audio.ended) { this.playing = false; this._emit(); }
        },
        // (while holding, the clock stays at the hold point: late events from the
        //  element -- e.g. 'waiting' after a play() that was just paused -- must not move it)
        waiting: () => { if (!this._holding) this._stopAt(audio.currentTime); },      // buffering stall
        seeked: () => { if (!this._holding) this._anchor(audio.currentTime, performance.now()); },
        ended: () => {
          // a quick-start clip running out is not the end of the song: hold
          if (this.partialAudio && this.playing) { this.hold(audio.duration); return; }
          this.playing = false; this._stopAt(audio.duration); this._emit(); if (this.onEnded) this.onEnded();
        },
        durationchange: () => { if (isFinite(audio.duration)) this.duration = Math.max(this.duration, audio.duration); },
      };
      for (const k in on) audio.addEventListener(k, on[k]);
      this._listeners = on;
    }

    detach() {
      const a = this.audio;
      if (!a) return;
      const now = performance.now();
      const pos = this.time(now);
      for (const k in this._listeners) a.removeEventListener(k, this._listeners[k]);
      a.pause();
      this.audio = null;
      this._listeners = null;
      this._anchor(pos, now);
      this._running = this.playing;             // continue silently if playing
    }

    _anchor(media, perf) {
      this._anchorMedia = media;
      this._anchorPerf = perf;
      this._lastReported = NaN;
      this._lastReportPerf = 0;
      this._waiting = false;
    }
    _stopAt(media) {
      this._running = false;
      this._anchor(media, performance.now());
    }
    _emit(err) { if (this.onStateChange) this.onStateChange(this, err); }
  }

  /**
   * AudioOut -- routes playback through a Web Audio graph so the remaining
   * piece of the A/V chain, the audio device's output latency, is known
   * (AudioContext.outputLatency) and can be compensated automatically:
   *   shown chart time = clock - outputLatency - manual offset
   * Measured in Chromium with an AudioWorklet tap: without compensation the
   * picture leads the sound by ~outputLatency; with it the residual is a few ms.
   * The context is created on the first user gesture; an element is routed only

      if (this.ctx || this.failed) return this.ready;
      const AC = root.AudioContext || root.webkitAudioContext;

      this.title = h("div", "rs-k-card-title", meta);
      this.sub = h("div", "rs-k-card-sub", meta);
      this.pill = h("div", "rs-k-pill", el);
      this.empty = h("div", "rs-k-empty", el);
      this.empty.innerHTML = `<div class="rs-k-empty-icon">${ICON.mic}</div><div>${this.hooks.emptyHtml ||
        "<b>No song loaded</b><br><span>Pick a song with lyrics, or drop a Rocksmith <code>.psarc</code> that has a vocals track.</span>"}</div>`;
      this.banner = h("div", "rs-k-banner", el);
      this._buildTransport();

      this._ro = new ResizeObserver(() => this._resize());
      this._ro.observe(el);
      this._onKey = (e) => this._key(e);
      document.addEventListener("keydown", this._onKey);
      this.track.addEventListener("click", (e) => {
        const line = e.target.closest && e.target.closest(".rs-k-line");
        if (line && this.song) this.seekLine(+line.dataset.i);
      });
      this._loop = this._loop.bind(this);
      this._raf = 0;
      this.applyOptions({});
      this._sync();
    }

    // ---- data ------------------------------------------------------------------------
    /** data: {song: payload (JSON string or object), options} -- or the payload itself. */
    load(data) {
      if (!data) { this.clear(); return; }
      const payload = data.song !== undefined ? data.song : data;
      if (!payload) { this.clear(); return; }
      const S = K.prepare(payload);
      const same = S.songKey && this.song && S.songKey === this.song.songKey;
      if (!same) this.deck.reset(S.songKey, S.duration);
      else this.clock.duration = Math.max(this.clock.duration, S.duration);
      this.song = S;
      this._buildLines();
      this._setMeta();
      if (data.options) this.applyOptions(data.options);
      this.el.classList.add("has-song");
      this._buildStrip();
      this._state = null; this._sec = undefined; this._cueOn = undefined; this._cueTxt = undefined; this._cueDots = undefined;
      this._jumpTo = null;
      this._layout(true);
      this._sync();
      this._start();
      if (this.hooks.onReady) this.hooks.onReady({ songKey: S.songKey, audio: this.deck.kind || "none",
        hasAudio: this.deck.kind === "full", formats: K.playableFormats(), nonce: Date.now() });
    }

    clear() {
      this.deck.reset(null, 0);
      this.song = null;
      this.track.innerHTML = ""; this.lineEls = []; this.secEls = []; this.sylEls = [];
      this._jumpTo = null;
      this.el.classList.remove("has-song");
      this.backdrop.style.backgroundImage = ""; this.art.style.backgroundImage = "";
      this.art.classList.add("is-empty");
      this.cue.classList.remove("is-on"); this.pill.classList.remove("is-on");
      this._stop();
      this._sync();
    }

    setAudio(url, songKey, kind, seconds) {
      if (songKey && this.song && songKey !== this.song.songKey) return Promise.resolve(false);
      return this.deck.set(url, songKey || (this.song && this.song.songKey), kind, seconds);
    }

    _setMeta() {
      const m = this.song.meta || {};
      this.title.textContent = m.title || "Untitled";
      this.sub.textContent = [m.artist, m.album && m.album !== m.title ? m.album : null, m.year].filter(Boolean).join("  \u00b7  ");
      let url = null;
      if (this.song.art && HW.ddsToDataURL) { try { url = HW.ddsToDataURL(this.song.art); } catch (e) { url = null; } }
      this.art.style.backgroundImage = url ? `url(${url})` : "";
      this.art.classList.toggle("is-empty", !url);
      this.backdrop.style.backgroundImage = url ? `url(${url})` : "";
    }

    _buildLines() {
      const S = this.song;
      this.track.innerHTML = "";
      this.lineEls = []; this.secEls = []; this.sylEls = [];
      S.lines.forEach((L, k) => {
        if (S.cues[k]) { const c = h("div", "rs-k-sec", this.track, S.cues[k]); this.secEls.push(c); }
        const el = h("div", "rs-k-line is-future", this.track);
        el.dataset.i = k;
        el.title = `${fmt(L.start)}  \u00b7  click to sing from here`;
        const spans = [];
        for (const W of L.words) {
          spans.push(h("span", "rs-k-syl", el, W.w));
          if (!W.j) el.appendChild(document.createTextNode(" "));
        }
        this.lineEls.push(el); this.sylEls.push(spans);
      });
    }

    // ---- options -----------------------------------------------------------------------
    applyOptions(o) {
      if (!o) return;
      const O = this.opts;
      for (const k of Object.keys(DEFAULTS)) if (o[k] !== undefined && o[k] !== null) O[k] = o[k];
      this.el.classList.toggle("is-sheet", O.view === "sheet");
      this.el.classList.toggle("no-sections", !O.sectionLabels);
      this.el.classList.toggle("no-backdrop", !O.backdrop);
      this.el.style.setProperty("--rs-k-scale", String(clamp(+O.textScale || 1, 0.4, 3)));
      this.offset = (+O.offsetMs || 0) / 1000;
      this.deck.autoLatency = !!O.autoLatency;
      // apply the speed only when the *setting* changes
      if (+O.playbackRate > 0 && +O.playbackRate !== this._rateSetting) {
        this._rateSetting = +O.playbackRate;
        this.clock.setRate(this._rateSetting);
      }
      this._layout(true);
      this._sync();
    }
    /** Shiny-style alias */
    settings(o) { this.applyOptions(o); }

    // ---- transport ---------------------------------------------------------------------
    _buildTransport() {
      const bar = (this.transport = h("div", "rs-k-transport", this.el));
      const btn = (cls, svg, title, fn) => {
        const b = h("button", "rs-k-btn" + (cls ? " " + cls : ""), bar);
        b.type = "button"; b.innerHTML = svg; b.title = title; b.setAttribute("aria-label", title);
        b.addEventListener("click", (e) => { fn(); e.currentTarget.blur(); });
        return b;
      };
      this.btnPlay = btn("rs-k-btn-play", ICON.play, "Play / pause (Space)", () => this.togglePlay());
      btn("", ICON.restart, "Back to the start (Home)", () => this.seek(0));
      btn("", ICON.prev, "Previous line (\u2191)", () => this.stepLine(-1));
      btn("", ICON.next, "Next line (\u2193)", () => this.stepLine(1));
      this.time = h("span", "rs-k-time", bar);
      this.strip = h("div", "rs-k-strip", bar);
      this.segs = h("div", "rs-k-segs", this.strip);
      this.future = h("div", "rs-k-future", this.strip);
      this.head = h("div", "rs-k-head", this.strip);
      this.hover = h("div", "rs-k-hovertip", this.strip);
      this.rateBadge = h("span", "rs-k-badge", bar);
      const at = (e) => { const r = this.strip.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * (this.clock.duration || 0); };
      this.strip.addEventListener("pointerdown", (e) => {
        if (!this.song) return;
        this.strip.setPointerCapture(e.pointerId);
        this.seek(at(e));
        const move = (ev) => this.seek(at(ev));
        const up = () => { this.strip.removeEventListener("pointermove", move); this.strip.removeEventListener("pointerup", up); };
        this.strip.addEventListener("pointermove", move);
        this.strip.addEventListener("pointerup", up);
      });
      this.strip.addEventListener("mousemove", (e) => {
        if (!this.song) return;
        const t = at(e), s = this.song.sections, r = this.strip.getBoundingClientRect();
        const i = upperBound(s.t, t + 1e-6) - 1;
        this.hover.textContent = (i >= 0 ? s.label[i] + "  \u00b7  " : "") + fmt(t);
        this.hover.style.left = clamp(e.clientX - r.left, 0, r.width) + "px";
      });
    }

    /** Timeline: sections as segments, sung lines as bars. */
    _buildStrip() {
      this.segs.innerHTML = "";
      const S = this.song, d = this.clock.duration || S.duration || 1;
      this._stripDur = d;
      const s = S.sections;
      for (let i = 0; i < s.n; i++) {
        const t0 = s.t[i], t1 = i + 1 < s.n ? s.t[i + 1] : d;
        const seg = h("div", "rs-k-seg" + (i % 2 ? " is-odd" : ""), this.segs);
        seg.style.left = (100 * t0 / d) + "%"; seg.style.width = Math.max(0, 100 * (t1 - t0) / d) + "%";
      }
      for (const L of S.lines) {
        const b = h("div", "rs-k-sung", this.segs);
        b.style.left = (100 * L.start / d) + "%"; b.style.width = Math.max(0.15, 100 * (L.end - L.start) / d) + "%";
      }
    }

    _sync(t) {
      if (t == null) t = this.clock.time(performance.now());
      const playing = this.clock.playing;
      if (playing !== this._shownPlaying) {
        this._shownPlaying = playing;
        this.btnPlay.innerHTML = playing ? ICON.pause : ICON.play;
        this.btnPlay.classList.toggle("is-playing", playing);
      }
      const d = this.clock.duration || 0;
      this.time.textContent = `${fmt(t)} / ${fmt(d)}`;
      const u = d ? clamp(t / d, 0, 1) : 0;
      this.head.style.left = (100 * u) + "%";
      this.future.style.left = (100 * u) + "%";
      this.transport.classList.toggle("is-silent", !this.deck.audio);
      const r = this.clock.rate;
      this.rateBadge.textContent = r !== 1 ? `${Math.round(r * 100)}%` : "";
      this.rateBadge.style.display = r !== 1 ? "" : "none";
      if (this.song && d && Math.abs(d - (this._stripDur || 0)) > 0.5) this._buildStrip();
    }

    _audioChanged() {
      if (this.song) this._buildStrip();
      this._sync();
    }

    async togglePlay() {
      if (!this.song) return;
      const c = this.clock, deck = this.deck;
      if (!c.playing && deck.autoLatency && !deck.out.ctx && !deck.out.failed) {
        await deck.out.ensure();                     // user gesture: create + resume the graph
      }
      if (!c.playing) deck.joinGraph();             // about to start: nothing else is playing
      const t = c.time(performance.now());
      if (!c.playing && deck.kind === "head" && t >= deck.headLimit) {
        c.playHeld(t);
        this.status("Loading the rest of the audio\u2026", "info");
        return;
      }
      if (!c.playing && c.duration > 0 && t >= c.duration - 0.05) this.seek(0);
      const was = c.playing;
      c.toggle();
      if (was) deck.joinGraph();                    // just paused: safe moment to join
      this._sync();
    }
    play() { if (!this.clock.playing) return this.togglePlay(); }
    pause() { if (this.clock.playing) { this.clock.pause(); this.deck.joinGraph(); this._sync(); } }

    seek(t) {
      if (!this.song) return;
      t = Math.max(0, t);
      this._jumpTo = null;
      this.deck.joinGraph();
      if (this.deck.kind === "head" && t >= this.deck.headLimit) {
        this.clock.hold(t);
        this.status("Loading the rest of the audio\u2026", "info");
      } else {
        this.clock.seek(t);
        if (this.deck.kind !== "head" || !this.clock.holding) this.status("", "clear");
      }
      this._jump = true;                            // no scroll animation after a jump
      this._sync();
      this._drawOnce();
    }
    /** Jump to a line with a 1.5 s run-up (in song time, i.e. as heard). */
    seekLine(k) {
      if (!this.song) return;
      k = clamp(k | 0, 0, this.song.lines.length - 1);
      this.seek(this.song.lines[k].start - 1.5 + this.offset + this._lat);
      this._jumpTo = k;                               // (after seek(), which forgets it)
    }
    /** Previous / next line (up / down). Relative to the line being sung -- or, during
     *  the run-up after a jump, to the line jumped to (the previous line is still
     *  shown then). "Previous" first restarts the current line once it is under way. */
    stepLine(dir) {
      if (!this.song) return;
      const L = this.song.lines, t = this.lyricTime(performance.now());
      let cur = -1;
      while (cur + 1 < L.length && L[cur + 1].start <= t + 1e-6) cur++;
      const pending = this._jumpTo != null && this._jumpTo < L.length && t < L[this._jumpTo].start ? this._jumpTo : null;
      let k;
      if (dir > 0) k = (pending != null ? pending : cur) + 1;
      else k = pending != null ? pending - 1 : cur >= 0 && t - L[cur].start > 1 ? cur : cur - 1;
      this.seekLine(clamp(k, 0, L.length - 1));
    }

    /** Lyric time (as heard) of a performance.now() timestamp. */
    lyricTime(perfMs) { return this.clock.time(perfMs) - this.offset - this._lat; }

    status(text, level) {
      this.banner.textContent = text || "";
      this.banner.className = "rs-k-banner" + (text && level !== "clear" ? " is-" + level : "");
    }

    command(msg) {
      const a = msg.args || {};
      switch (msg.cmd) {
        case "audio": this.setAudio(a.url, a.songKey, a.kind, a.seconds); break;
        case "play": this.play(); break;
        case "pause": this.pause(); break;
        case "seek": this.seek(+a.time || 0); break;
        case "settings": this.applyOptions(a.settings); break;
        case "status": this.status(a.text, a.level); break;
        default: console.warn("rs-karaoke: unknown command", msg.cmd);
      }
    }

    // ---- view ----------------------------------------------------------------------------
    /** Re-measure line positions (after load, resize, text size / view change). */
    _layout(jump) {
      if (!this.song || !this.lineEls || !this.lineEls.length) return;
      this._vpH = this.viewport.clientHeight;
      this._pos = this.lineEls.map((e) => e.offsetTop + e.offsetHeight / 2);
      // top of each line's block: its section label when it has one (and labels are shown)
      this._top = this.lineEls.map((e) => {
        const sec = e.previousElementSibling;
        return sec && sec.classList.contains("rs-k-sec") && sec.offsetHeight ? sec.offsetTop : e.offsetTop;
      });
      this._scrolledTo = null;
      if (jump) this._jump = true;
      this._drawOnce();
    }

    _anchor() { return this._vpH * (this.opts.view === "sheet" ? 0.34 : 0.44); }

    _scrollTo(k) {
      if (!this._pos || k < 0 || k >= this._pos.length) return;
      const y = Math.round(this._anchor() - this._pos[k]);
      if (y === this._scrolledTo) return;
      this._scrolledTo = y;
      this.track.classList.toggle("no-anim", !!this._jump);
      this.track.style.transform = `translate3d(0, ${y}px, 0)`;
      if (this._jump) { void this.track.offsetHeight; this.track.classList.remove("no-anim"); }
      this._jump = false;
      // the cue (intro / break countdown) sits just above the focus line and its section label
      this.cue.style.top = Math.max(8, this.viewport.offsetTop + this._anchor() - this._pos[k] + this._top[k] - 8) + "px";
    }

    /** Draw the lyrics for lyric time t (only touches the DOM when something changed). */
    render(t) {
      const S = this.song;
      if (!S || !this.lineEls) return;
      const st = K.state(S, t), prev = this._state;
      this._state = st;
      const lineChanged = !prev || prev.focus !== st.focus || prev.mode !== st.mode;
      if (lineChanged) {
        const cur = st.mode === "sing" || st.mode === "outro";
        for (let k = 0; k < this.lineEls.length; k++) {
          const cls = k < st.focus ? "is-past" : k > st.focus ? "is-future" : cur ? "is-current" : "is-next";
          const e = this.lineEls[k];
          if (e._cls !== cls) { e.className = "rs-k-line " + cls; e._cls = cls; }
        }
        if (prev && prev.focus >= 0 && prev.focus !== st.focus) this._paintWords(prev.focus, -1, 0, true);
      }
      this._scrollTo(st.focus);
      if (st.mode === "sing" || st.mode === "outro") this._paintWords(st.focus, st.word, st.p, lineChanged || !prev || prev.word !== st.word);
      // intro / break cue: "Intro . 0:12" or "Instrumental . 0:08", count-in dots in the last seconds
      const waiting = st.mode === "intro" || st.mode === "break";
      if (waiting) {
        const left = st.until - t;
        const dots = this.opts.countIn && left <= COUNT_IN ? Math.ceil(left) : 0;
        const txt = left > COUNT_IN || !this.opts.countIn ? `${st.mode === "intro" ? "Intro" : "Instrumental"}  \u00b7  ${fmt(Math.ceil(left))}` : "";
        if (txt !== this._cueTxt) { this.cueText.textContent = txt; this._cueTxt = txt; }
        if (dots !== this._cueDots) {
          this._cueDots = dots;
          const ds = this.cueDots.children;
          for (let i = 0; i < ds.length; i++) ds[i].className = i < dots ? "is-on" : "";
          this.cue.classList.toggle("is-counting", dots > 0);
        }
      }
      if (waiting !== this._cueOn) { this._cueOn = waiting; this.cue.classList.toggle("is-on", waiting); }
      // section pill
      const si = upperBound(S.sections.t, t + 1e-6) - 1;
      if (si !== this._sec) {
        this._sec = si;
        this.pill.textContent = si >= 0 ? S.sections.label[si] : "";
        this.pill.classList.toggle("is-on", si >= 0);
      }
    }

    /** Syllable classes of line k: before `word` sung, `word` wiping (p), after unsung. */
    _paintWords(k, word, p, full) {
      const spans = this.sylEls[k];
      if (!spans) return;
      if (full) {
        for (let i = 0; i < spans.length; i++) {
          const cls = i < word ? "rs-k-syl is-sung" : i === word ? "rs-k-syl is-now" : "rs-k-syl";
          if (spans[i].className !== cls) spans[i].className = cls;
          if (i !== word && spans[i]._p != null) { spans[i].style.removeProperty("--p"); spans[i]._p = null; }
        }
      }
      if (word >= 0 && word < spans.length) {
        const q = Math.round(p * 200) / 200;
        const sp = spans[word];
        if (sp._p !== q) { sp._p = q; sp.style.setProperty("--p", String(q)); }
      }
    }

    // ---- loop ----------------------------------------------------------------------------
    _start() { if (!this._raf) { this._lastFrame = 0; this._raf = requestAnimationFrame(this._loop); } }
    _stop() { if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }

    _loop(ts) {
      this._raf = 0;
      if (!this.el.isConnected) { this.destroy(); return; }
      const dt = this._lastFrame ? (ts - this._lastFrame) / 1000 : 0;
      this._lastFrame = ts;
      if (dt > 0 && dt < 0.1) this.frameLead = this.frameLead * 0.9 + dt * 0.1;
      this.clock.tick(ts);
      const t = this.clock.time(ts + this.frameLead * 1000);      // when this frame is on screen
      const deck = this.deck;
      if (deck.kind === "head" && this.clock.playing && !this.clock.holding && t >= deck.headLimit) {
        this.clock.hold(t);
        this.status("Loading the rest of the audio\u2026", "info");
      }
      // output latency, ramped at 0.1 s/s so the highlight never jumps
      const target = deck.latency(ts);
      this._lat += clamp(target - this._lat, -0.1 * dt, 0.1 * dt) || 0;
      if (dt <= 0 || dt > 0.5 || Math.abs(this._lat - target) < 1e-4) this._lat = target;
      if (Math.abs(target - this._latReported) > 0.002 && this._lat === target) {
        this._latReported = target;
        if (this.hooks.onLatency) this.hooks.onLatency({ outputMs: Math.round(1000 * deck.out.latency(ts + 2000)),
          routed: !!(deck.audio && deck.audio._gain), auto: deck.autoLatency, nonce: Date.now() });
      }
      if (this._visible !== false) {
        this.render(t - this.offset - this._lat);
        if (ts - (this._lastUi || 0) > 100) { this._lastUi = ts; this._sync(t); }
      }
      if (this.hooks.onState && this.clock.playing && ts - (this._lastState || 0) > 500) {
        this._lastState = ts;
        this.hooks.onState({ t: +t.toFixed(3), playing: true, line: this._state ? this._state.focus : -1, nonce: Date.now() });
      }
      this._raf = requestAnimationFrame(this._loop);
    }

    _drawOnce() {
      if (!this.song || this._raf) return;           // the loop will pick it up
      this.render(this.lyricTime(performance.now()));
    }

    _resize() {
      const r = this.el.getBoundingClientRect();
      this._visible = r.width > 0 && r.height > 0;
      this.el.classList.toggle("is-compact", r.width < 720);
      if (this._visible) this._layout(true);
    }

    _key(e) {
      if (!this.song || !this.el.isConnected || !this._visible || !this.el.getClientRects().length) return;
      const tag = (e.target && e.target.tagName) || "";
      if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(tag) || (e.target && e.target.isContentEditable)) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const t = this.clock.time(performance.now());
      switch (e.code) {
        case "Space": this.togglePlay(); break;
        case "ArrowLeft": this.seek(t - 5); break;
        case "ArrowRight": this.seek(t + 5); break;
        case "ArrowUp": this.stepLine(-1); break;
        case "ArrowDown": this.stepLine(1); break;
        case "Home": this.seek(0); break;
        default: return;
      }
      e.preventDefault();
    }

    destroy() {
      this._stop();
      this.deck.unload();
      this._ro.disconnect();
      document.removeEventListener("keydown", this._onKey);
      if (this.hooks.onDestroy) this.hooks.onDestroy(this);
    }
  }
  K.KaraokePlayer = KaraokePlayer;
})(window);
</script>
<script>
/* ---------------------------------------------------------------------------
 * karaoke-page.js -- standalone-page host for the karaoke player (the HTML
 * delivery format; karaoke_export_html() inlines it with karaoke.js).
 *
 * Reads <script id="rs-karaoke-data">{title, options, songs: [karaoke_json()
 * payloads]}; each song's audio is {embed: <id of a base64 <script>>, type},
 * {src: relative URL, type} or absent ("Load audio..." pairs a local file).
 * View, text size and speed are remembered in localStorage, the lyrics timing
 * per song.
 * ------------------------------------------------------------------------- */
(function () {
  "use strict";
  const K = window.RSKaraoke;
  const data = JSON.parse(document.getElementById("rs-karaoke-data").textContent || "{}");
  const songs = data.songs || [];
  const $ = (id) => document.getElementById(id);
  const STORE = "rs-karaoke-page";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { saved = {}; }
  const opts = Object.assign({ view: "stage", textScale: 1, playbackRate: 1 }, data.options || {}, saved.opts || {});
  const offsets = Object.assign({}, saved.offsets || {});
  let current = -1;

  const el = $("rs-karaoke");
  const player = new K.KaraokePlayer(el, { emptyHtml: "<b>No songs in this page</b>" });
  window.karaokePage = { player, songs, load: (i) => loadSong(i) };          // (for scripting and tests)

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ opts: { view: opts.view, textScale: opts.textScale, playbackRate: opts.playbackRate },
                                                       offsets, song: songs[current] && songs[current].songKey })); } catch (e) { /* private mode */ }
  }
  function label(s) { const m = s.meta || {}; return [m.artist, m.title].filter(Boolean).join(" \u2014 ") || "Untitled"; }
  const key = () => (songs[current] ? songs[current].songKey : null);

  // ---- controls -------------------------------------------------------------------------
  const sel = $("rs-kp-song");
  songs.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = label(s); sel.appendChild(o); });
  document.body.classList.toggle("is-single", songs.length < 2);
  sel.addEventListener("change", () => { loadSong(+sel.value); sel.blur(); });

  function showView() { document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("is-on", b.dataset.view === opts.view)); }
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    opts.view = b.dataset.view; player.applyOptions({ view: opts.view }); showView(); save(); b.blur();
  }));
  const size = (f) => { opts.textScale = Math.max(0.5, Math.min(2.2, Math.round(opts.textScale * f * 100) / 100)); player.applyOptions({ textScale: opts.textScale }); save(); };
  $("rs-kp-smaller").addEventListener("click", (e) => { size(1 / 1.1); e.currentTarget.blur(); });
  $("rs-kp-bigger").addEventListener("click", (e) => { size(1.1); e.currentTarget.blur(); });

  const offLabel = $("rs-kp-offset");
  function showOffset() { const v = offsets[key()] || 0; offLabel.textContent = `${v > 0 ? "+" : ""}${v} ms`; }
  function nudge(ms) {
    const k = key(); if (!k) return;
    offsets[k] = Math.max(-5000, Math.min(5000, (offsets[k] || 0) + ms));
    player.applyOptions({ offsetMs: offsets[k] }); showOffset(); save();
  }
  $("rs-kp-earlier").addEventListener("click", (e) => { nudge(e.shiftKey ? -100 : -10); e.currentTarget.blur(); });
  $("rs-kp-later").addEventListener("click", (e) => { nudge(e.shiftKey ? 100 : 10); e.currentTarget.blur(); });
  offLabel.addEventListener("dblclick", () => nudge(-(offsets[key()] || 0)));

  const speed = $("rs-kp-speed");
  speed.value = String(opts.playbackRate);
  speed.addEventListener("change", () => { opts.playbackRate = +speed.value; player.applyOptions({ playbackRate: opts.playbackRate }); save(); speed.blur(); });

  $("rs-kp-audio").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f || !key()) return;
    player.deck.unload();                                  // replaces any embedded audio
    player.setAudio(URL.createObjectURL(f), key(), "full").then((ok) => {
      if (ok) player.status(`Playing along with \u201c${f.name}\u201d. If the words run early or late, adjust the timing (\u2212 / +).`, "info");
      setTimeout(() => player.status("", "clear"), 6000);
    });
    e.target.value = "";
  });
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); };
  $("rs-kp-full").addEventListener("click", (e) => { full(); e.currentTarget.blur(); });
  document.addEventListener("keydown", (e) => {
    if (e.code === "KeyF" && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { full(); e.preventDefault(); }
  });

  // ---- songs ------------------------------------------------------------------------------
  function loadSong(i) {
    if (!songs[i]) return;
    current = i; sel.value = String(i);
    const s = songs[i];
    player.load({ song: s, options: Object.assign({}, opts, { offsetMs: offsets[s.songKey] || 0 }) });
    document.title = songs.length > 1 ? `${label(s)} \u2014 karaoke` : (data.title || document.title);
    showOffset(); save();
    const a = s.audio;
    if (a && a.embed) {
      const node = document.getElementById(a.embed);
      if (node) player.setAudio(`data:${a.type || "audio/ogg"};base64,${node.textContent.trim()}`, s.songKey, "full");
    } else if (a && a.src) {
      player.setAudio(a.src, s.songKey, "full");
    } else {
      player.status("This page has no audio \u2014 use \u201cLoad audio\u2026\u201d to sing along with your own copy of the song.", "info");
      setTimeout(() => { if (!player.deck.audio && current === i) player.status("", "clear"); }, 8000);
    }
  }
  showView();
  const start = Math.max(0, songs.findIndex((s) => s.songKey === saved.song));
  if (songs.length) loadSong(start);
})();
</script>
</body>
</html>
