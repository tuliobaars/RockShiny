<!doctype html>
<!-- Frontend harness: loads the real highway assets with a minimal Shiny stub
     (OutputBinding / outputBindings / custom messages / setInputValue) so the
     binding, clock and renderer can be tested without an R process.
     Serve the repo root over HTTP and open
     /tests/frontend/harness.html?chart=wywh_lead&audio=clicks.ogg -->
<html>
<head>
  <meta charset="utf-8">
  <title>RockShiny highway harness</title>
  <script>window.$ = () => ({ find: () => [] });  /* binding.find() only runs under real Shiny */</script>
  <script>
    window.__inputs = [];
    window.Shiny = {
      OutputBinding: function () {},
      outputBindings: { register(b, name) { window.__binding = b; window.__bindingName = name; } },
      addCustomMessageHandler(type, fn) { (window.__handlers = window.__handlers || {})[type] = fn; },
      setInputValue(name, value) { window.__inputs.push({ name, value, at: performance.now() }); },
    };
  </script>
  <link rel="stylesheet" href="../../inst/highway/highway.css">
  <script src="../../inst/highway/clock.js"></script>
  <script src="../../inst/highway/renderer.js"></script>
  <script src="../../inst/highway/renderer-dom.js"></script>
  <script src="../../inst/highway/renderer-lanes.js"></script>
  <script src="../../inst/highway/dds.js"></script>
  <script src="../../inst/highway/overlays.js"></script>
  <script src="../../inst/highway/input.js"></script>
  <script src="../../inst/highway/mic.js"></script>
  <script src="../../inst/highway/guide.js"></script>
  <script src="../../inst/highway/binding.js"></script>
  <style>body { margin: 0; background: #000; } #hw { width: 100vw; height: 100vh; }</style>
</head>
<body>
  <div id="hw" class="rs-highway" tabindex="0"></div>
  <script>
    const q = new URLSearchParams(location.search);
    window.harness = {
      async loadChart(name, options) {
        const txt = await (await fetch(`fixtures/${name}.json`)).text();
        window.__binding.renderValue(document.getElementById("hw"), { chart: txt, options: options || {} });
        return JSON.parse(txt).songKey;
      },
      message(cmd, args) { window.__handlers["rs-highway"]({ id: "hw", cmd, args: args || {} }); },
      ctl() { return RSHighway.controllers.get("hw"); },
    };
    (async () => {
      if (!q.get("chart")) return;
      const key = await harness.loadChart(q.get("chart"), { lookahead: +(q.get("lookahead") || 3), renderer: q.get("renderer") || "canvas" });
      if (q.get("audio")) harness.message("audio", { url: `fixtures/${q.get("audio")}`, songKey: key });
      if (q.get("t")) harness.message("seek", { time: +q.get("t") });
      window.__ready = true;
    })();
  </script>
</body>
</html>
