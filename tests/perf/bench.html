<!doctype html>
<!-- Renderer/page benchmark. Query params:
       page=plain|shiny   plain HTML page, or a Shiny/bslib-like page (Bootstrap 5.3 + jQuery +
                          sidebar with inputs + a text output updated at 4 Hz like renderText)
       renderer=canvas|dom     (renderer.js / renderer-dom.js)
       chart=<fixture name>, t=<start time>
     Vendor files are loaded from ./vendor/ if present, else from a CDN. -->
<html>
<head>
  <meta charset="utf-8">
  <script>
    const Q = new URLSearchParams(location.search);
    window.PAGE = Q.get("page") || "plain"; window.RENDERER = Q.get("renderer") || "canvas";
    window.__inputs = [];
    window.Shiny = {
      OutputBinding: function () {}, outputBindings: { register(b) { window.__binding = b; } },
      addCustomMessageHandler(t, fn) { (window.__handlers = window.__handlers || {})[t] = fn; },
      setInputValue(name, value) { window.__inputs.push({ name, value }); if (window.onShinyInput) window.onShinyInput(name, value); },
    };
    function vendor(local, cdn, tag) {
      document.write(tag === "css" ? `<link rel="stylesheet" href="${local}" onerror="this.onerror=null;this.href='${cdn}'">`
                                   : `<script src="${local}" onerror="this.onerror=null;this.src='${cdn}'"><\/script>`);
    }
    if (PAGE === "shiny") {
      vendor("vendor/bootstrap.min.css", "https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css", "css");
      vendor("vendor/jquery.min.js", "https://code.jquery.com/jquery-3.7.1.min.js");
      vendor("vendor/bootstrap.bundle.min.js", "https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js");
    } else { window.$ = () => ({ find: () => [] }); }
  </script>
  <link rel="stylesheet" href="../../inst/highway/highway.css">
  <script src="../../inst/highway/clock.js"></script>
  <script src="../../inst/highway/renderer.js"></script>
  <script src="../../inst/highway/renderer-dom.js"></script>
  <script src="../../inst/highway/renderer-lanes.js"></script>
  <script src="../../inst/highway/dds.js"></script>
  <script src="../../inst/highway/overlays.js"></script>
  <script src="../../inst/highway/input.js"></script>
  <script src="../../inst/highway/mic.js"></script>
  <script src="../../inst/highway/guide.js"></script>
  <script src="../../inst/highway/binding.js"></script>
  <style>
    body.plain { margin: 0; background: #000; }
    body.shiny .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 56px); }
    #hw { width: 960px; height: 600px; }   /* identical pixel count in both page types */
  </style>
</head>
<body>
  <div id="page"></div>
  <script>
    const page = document.getElementById("page");
    document.body.className = PAGE;
    if (PAGE === "shiny") {   // markup shaped like bslib::page_sidebar() + our modules
      page.innerHTML = `
        <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">RockShiny</span></div></nav>
        <div class="layout">
          <aside class="p-3 border-end overflow-auto">
            <div class="mb-3"><label class="form-label">Drop a .psarc</label><input class="form-control" type="file"></div>
            ${["Songs folder", "Arrangement", "Playback speed"].map(l => `<div class="mb-3"><label class="form-label">${l}</label>
               <select class="form-select">${Array.from({length: 18}, (_, i) => `<option>Option ${i}</option>`).join("")}</select></div>`).join("")}
            ${["Highway length", "A/V offset"].map(l => `<div class="mb-3"><label class="form-label">${l}</label><input type="range" class="form-range"></div>`).join("")}
            <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Invert strings</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Fret numbers</label></div>
            <dl class="mt-3"><dt>Position</dt><dd id="pos" class="shiny-text-output"></dd></dl>
          </aside>
          <main class="p-3"><div id="hw" class="rs-highway" tabindex="0"></div></main>
        </div>`;
      // simulate the renderText() round trip: telemetry -> server -> DOM update (4 Hz)
      const pos = document.getElementById("pos");
      window.onShinyInput = (name, v) => { if (name.endsWith("_state")) { pos.classList.add("recalculating");
        setTimeout(() => { pos.textContent = `${v.t.toFixed(1)} ${v.section} (${v.fps} fps)`; pos.classList.remove("recalculating"); }, 5); } };
    } else {
      page.innerHTML = `<div id="hw" class="rs-highway" tabindex="0"></div>`;
    }
    window.bench = {
      async setup(chart, t) {
        const el = document.getElementById("hw");
        const txt = await (await fetch(`../frontend/fixtures/${chart}.json`)).text();
        window.__binding.renderValue(el, { chart: txt, options: { lookahead: 3 } });
        const c = RSHighway.controllers.get("hw");
        if (RENDERER === "dom") c.setRenderer("dom");
        c.clock.seek(t); c.clock.play();
        return true;
      },
      frames(ms) {            // rAF intervals over `ms`
        return new Promise(res => { const out = []; let last = 0; const t0 = performance.now();
          (function f(ts) { if (last) out.push(ts - last); last = ts; if (ts - t0 < ms) requestAnimationFrame(f); else res(out); })(t0); });
      },
    };
  </script>
</body>
</html>
